<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Feature Audit Dashboard</title>
  <meta name="robots" content="noindex, nofollow" />

  <!-- CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nouislider@15.7.1/dist/nouislider.min.css" />

  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 20px;
    }

    .filter-box {
      border: 1px solid #ccc;
      padding: 10px;
      width: 200px;
      max-height: 300px;
      overflow-y: auto;
    }

    .filter-box h4 {
      margin-top: 0;
    }

    .slider-container {
      margin-bottom: 10px;
    }

    .slider-label {
      font-weight: bold;
      margin-bottom: 5px;
    }

    #productTable {
      width: 100%;
    }
  </style>
</head>
<body>
  <h2>Feature Audit Dashboard (Sliders + Checkbox Filters)</h2>

  <div class="filters">
    <div class="filter-box" id="regionFilter">
      <h4>Filter by Region</h4>
      <label><input type="checkbox" class="select-all" checked> Select All</label>
      <div class="checkbox-list"></div>
    </div>

    <div class="filter-box" id="makeFilter">
      <h4>Filter by Make</h4>
      <label><input type="checkbox" class="select-all" checked> Select All</label>
      <div class="checkbox-list"></div>
    </div>

    <div class="filter-box slider-container">
      <div class="slider-label">Centre Screen Size (in)</div>
      <div id="slider-centre"></div>
    </div>

    <div class="filter-box slider-container">
      <div class="slider-label">Cluster Size (in)</div>
      <div id="slider-cluster"></div>
    </div>

    <div class="filter-box slider-container">
      <div class="slider-label"># Speakers</div>
      <div id="slider-speakers"></div>
    </div>
  </div>

  <table id="productTable" class="display"></table>

  <!-- JS -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nouislider@15.7.1/distribute/nouislider.min.js"></script>

  <script>
    let table;

    async function loadData() {
      const response = await fetch('https://docs.google.com/spreadsheets/d/e/2PACX-1vRmRu1_HWep8KGgPJPAITrGn9ljdlTtFjrx85qAAzeiSZfC9ecKX8T0aSE9rt6vYLdZZ1ZTW-VpJyHg/pub?output=csv');
      const csvText = await response.text();

      const rows = csvText
        .trim()
        .split('\n')
        .map(row => row.split(','))
        .filter(row => row.length > 1);

      const [headers, ...data] = rows;

      const thead = '<thead><tr>' + headers.map(h => `<th>${h}</th>`).join('') + '</tr></thead>';
      const tbody = '<tbody>' + data.map(row =>
        `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`
      ).join('') + '</tbody>';

      document.getElementById('productTable').innerHTML = thead + tbody;

      table = $('#productTable').DataTable({
        paging: true,
        searching: true,
        scrollX: true,
        destroy: true,
        pageLength: 25
      });

      createDropdownCheckboxes(0, 'regionFilter'); // Region
      createDropdownCheckboxes(1, 'makeFilter');   // Make

      createSliderFilter('slider-centre', 10);  // Centre Screen Size (in)
      createSliderFilter('slider-cluster', 13); // Cluster Size (in)
      createSliderFilter('slider-speakers', 16); // # Speakers
    }

    function createDropdownCheckboxes(colIndex, containerId) {
      const column = table.column(colIndex);
      const container = document.querySelector(`#${containerId} .checkbox-list`);
      const values = column.data().unique().sort().toArray();

      container.innerHTML = ''; // Clear

      values.forEach(val => {
        const label = document.createElement('label');
        label.innerHTML = `<input type="checkbox" class="filter-option" value="${val}" checked> ${val}`;
        container.appendChild(label);
      });

      // Event listeners
      container.querySelectorAll('input').forEach(input => {
        input.addEventListener('change', () => applyFilters());
      });

      const selectAll = document.querySelector(`#${containerId} .select-all`);
      selectAll.addEventListener('change', function () {
        container.querySelectorAll('input[type=checkbox]').forEach(opt => opt.checked = this.checked);
        applyFilters();
      });
    }

    function createSliderFilter(sliderId, colIndex) {
      const columnData = table.column(colIndex).data().map(val => parseFloat(val)).filter(v => !isNaN(v));
      const min = Math.min(...columnData);
      const max = Math.max(...columnData);

      const slider = document.getElementById(sliderId);
      if (!slider) return;

      noUiSlider.create(slider, {
        start: [min, max],
        connect: true,
        step: 1,
        range: { min: min, max: max },
        tooltips: true
      });

      slider.noUiSlider.on('update', () => applyFilters());
    }

    function applyFilters() {
      // Region & Make (columns 0,1)
      ['regionFilter', 'makeFilter'].forEach((id, index) => {
        const checkedVals = Array.from(document.querySelectorAll(`#${id} .filter-option:checked`))
          .map(cb => $.fn.dataTable.util.escapeRegex(cb.value));
        table.column(index).search(checkedVals.length ? checkedVals.join('|') : '', true, false);
      });

      // Sliders
      $.fn.dataTable.ext.search = [];

      const sliderConfigs = [
        { id: 'slider-centre', col: 10 },
        { id: 'slider-cluster', col: 13 },
        { id: 'slider-speakers', col: 16 }
      ];
