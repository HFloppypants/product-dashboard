<meta name="robots" content="noindex, nofollow">
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Feature Audit</title>

  <!-- DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />

  <!-- Choices.js CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />

  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }

    .filters {
      background: #f1f1f1;
      padding: 15px;
      border: 1px solid #ccc;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .filter-group {
      flex: 1 1 300px;
    }

    table {
      width: 100%;
    }

    .choices__list--dropdown .choices__item {
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <h2>UDS Infotainment Feature Audit - Dropdown Checkbox Filters</h2>

  <div class="filters">
    <div class="filter-group">
      <label for="regionFilter">Region</label>
      <select id="regionFilter" multiple></select>
    </div>
    <div class="filter-group">
      <label for="makeFilter">Make</label>
      <select id="makeFilter" multiple></select>
    </div>
    <button onclick="clearAllFilters()">Clear All Filters</button>
  </div>

  <table id="productTable" class="display" style="width:100%"></table>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

  <!-- Choices.js -->
  <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>

  <script>
    let table;
    let choicesInstances = {};

    async function loadData() {
      const response = await fetch(
        'https://docs.google.com/spreadsheets/d/e/2PACX-1vRmRu1_HWep8KGgPJPAITrGn9ljdlTtFjrx85qAAzeiSZfC9ecKX8T0aSE9rt6vYLdZZ1ZTW-VpJyHg/pub?output=csv'
      );
      const csvText = await response.text();

      const rows = csvText
        .trim()
        .split('\n')
        .map(row => row.split(','))
        .filter(row => row.length > 1);

      const [headers, ...data] = rows;

      const thead = '<thead><tr>' + headers.map(h => `<th>${h}</th>`).join('') + '</tr></thead>';
      const tbody = '<tbody>' + data.map(row =>
        `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`
      ).join('') + '</tbody>';

      document.getElementById('productTable').innerHTML = thead + tbody;

      table = $('#productTable').DataTable({
        paging: true,
        searching: true,
        scrollX: true,
        destroy: true,
        pageLength: 25
      });

      // Setup dropdown filters
      createDropdownFilter(0, 'regionFilter');
      createDropdownFilter(1, 'makeFilter');
    }

    function createDropdownFilter(colIndex, selectId) {
      const column = table.column(colIndex);
      const uniqueValues = column.data().unique().sort().toArray();

      const selectEl = document.getElementById(selectId);
      selectEl.innerHTML = ''; // clear existing

      uniqueValues.forEach(val => {
        const option = document.createElement('option');
        option.value = val;
        option.text = val;
        option.selected = true;
        selectEl.appendChild(option);
      });

      const choices = new Choices(selectEl, {
        removeItemButton: true,
        searchEnabled: true,
        shouldSort: true,
        position: 'bottom',
        placeholder: true
      });

      choicesInstances[selectId] = choices;

      selectEl.addEventListener('change', () => {
        applyFilters();
      });
    }

    function applyFilters() {
      // Region
      const regionChoices = choicesInstances['regionFilter'].getValue(true); // array of values
      table.column(0).search(regionChoices.length ? regionChoices.join('|') : '', true, false);

      // Make
      const makeChoices = choicesInstances['makeFilter'].getValue(true);
      table.column(1).search(makeChoices.length ? makeChoices.join('|') : '', true, false);

      table.draw();
    }

    function clearAllFilters() {
      Object.values(choicesInstances).forEach(instance => {
        instance.removeActiveItems();
        instance.setChoiceByValue([]); // clear selection
      });
      applyFilters();
    }

    loadData();
  </script>

</body>
</html>
