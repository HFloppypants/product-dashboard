<meta name="robots" content="noindex, nofollow">
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multi-Filter Product Dashboard</title>

  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }
    .filters {
      margin-bottom: 20px;
      padding: 10px;
      border: 1px solid #ccc;
      background: #f9f9f9;
    }
    .filter-group {
      margin-bottom: 10px;
    }
    .filter-group label {
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
    }
    .filter-group .option {
      display: inline-block;
      margin-right: 10px;
    }
    .filter-group input[type="checkbox"] {
      margin-right: 5px;
    }
  </style>
</head>
<body>

  <h2>Interactive Product Dashboard</h2>

  <div class="filters">
    <div id="filter-region" class="filter-group"></div>
    <div id="filter-make" class="filter-group"></div>
    <button onclick="clearAllFilters()">Clear All Filters</button>
  </div>

  <table id="productTable" class="display" style="width:100%"></table>

  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

  <script>
    let table;

    async function loadData() {
      const response = await fetch(
        'https://docs.google.com/spreadsheets/d/e/2PACX-1vRmRu1_HWep8KGgPJPAITrGn9ljdlTtFjrx85qAAzeiSZfC9ecKX8T0aSE9rt6vYLdZZ1ZTW-VpJyHg/pub?output=csv'
      );
      const csvText = await response.text();

      const rows = csvText
        .trim()
        .split('\n')
        .map(row => row.split(','))
        .filter(row => row.length > 1);

      const [headers, ...data] = rows;

      // Build table structure
      const thead = '<thead><tr>' + headers.map(h => `<th>${h}</th>`).join('') + '</tr></thead>';
      const tbody = '<tbody>' + data.map(row =>
        `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`
      ).join('') + '</tbody>';

      document.getElementById('productTable').innerHTML = thead + tbody;

      table = $('#productTable').DataTable({
        paging: true,
        searching: true,
        scrollX: true,
        destroy: true,
        pageLength: 25
      });

      // Add filters for Region (column 0) and Make (column 1)
      addMultiSelectFilter(0, "Region", "filter-region");
      addMultiSelectFilter(1, "Make", "filter-make");
    }

    function addMultiSelectFilter(colIndex, label, containerId) {
      const column = table.column(colIndex);
      const container = document.getElementById(containerId);
      const values = column.data().unique().sort();

      // Build filter group
      let html = `<label>${label}</label>`;
      html += `<div class="option"><input type="checkbox" id="${containerId}-all" checked> <span>Select All</span></div>`;

      values.each(val => {
        html += `<div class="option"><input type="checkbox" class="${containerId}-option" value="${val}" checked> ${val}</div>`;
      });

      container.innerHTML = html;

      // Handle filtering
      $(`#${containerId} input[type="checkbox"]`).on('change', function () {
        applyMultiFilters();
      });
    }

    function applyMultiFilters() {
      const regionVals = getCheckedValues('filter-region-option');
      const makeVals = getCheckedValues('filter-make-option');

      // Filter Region
      table.column(0).search(regionVals.length ? regionVals.join('|') : '', true, false);

      // Filter Make
      table.column(1).search(makeVals.length ? makeVals.join('|') : '', true, false);

      table.draw();
    }

    function getCheckedValues(className) {
      return $(`.${className}:checked`).map(function () {
        return $.fn.dataTable.util.escapeRegex($(this).val());
      }).get();
    }

    function clearAllFilters() {
      // Reset checkboxes
      $('.filters input[type=checkbox]').prop('checked', true);
      applyMultiFilters();
    }

    loadData();
  </script>

</body>
</html>
