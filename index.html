<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex, nofollow">
<title>Feature Audit</title>

<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />

<style>
body { font-family:sans-serif; font-size:14px; padding:20px; }
h2 { font-size:18px; margin-bottom:12px; }
h3 { font-size:15px; margin-bottom:10px; }

.filters { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:16px; }

.dropdown-filter { position:relative; width:220px; }
.dropdown-btn { background:#f1f1f1; padding:8px; border:1px solid #ccc; cursor:pointer; }

.dropdown-content {
  display:none;
  position:absolute;
  top:100%;
  left:0; right:0;
  background:#fff;
  border:1px solid #ccc;
  z-index:1000;
  max-height:240px;
  overflow-y:auto;
  padding:8px;
}

.dropdown-filter.open .dropdown-content { display:block; }

.range-filter {
  display:flex;
  flex-direction:column;
  gap:6px;
  padding:10px;
  border:1px solid #ccc;
  background:#fafafa;
  max-width:420px;
  margin-bottom:12px;
}

.col-panel { border:1px solid #ccc; padding:12px; margin-top:12px; }

.col-groups {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:12px;
}

.col-group { border:1px solid #e0e0e0; padding:10px; background:#fafafa; }
.group-head { font-weight:600; margin-bottom:8px; }
.cols { padding-left:18px; display:flex; flex-direction:column; gap:6px; }

label { display:flex; gap:6px; cursor:pointer; }

button { padding:8px 10px; border:1px solid #ccc; background:#f1f1f1; cursor:pointer; }
table { width:100%; }
</style>
</head>

<body>

<h2>Feature Audit</h2>

<div class="filters">
  <div id="regionFilter" class="dropdown-filter"><div class="dropdown-btn">Region</div><div class="dropdown-content"><label><input type="checkbox" class="select-all" checked> Select All</label><div class="checkbox-list"></div></div></div>
  <div id="makeFilter" class="dropdown-filter"><div class="dropdown-btn">Make</div><div class="dropdown-content"><label><input type="checkbox" class="select-all" checked> Select All</label><div class="checkbox-list"></div></div></div>
  <div id="vehicleSegmentFilter" class="dropdown-filter"><div class="dropdown-btn">Vehicle Segment</div><div class="dropdown-content"><label><input type="checkbox" class="select-all" checked> Select All</label><div class="checkbox-list"></div></div></div>
  <div id="priceSegmentFilter" class="dropdown-filter"><div class="dropdown-btn">Price Segment</div><div class="dropdown-content"><label><input type="checkbox" class="select-all" checked> Select All</label><div class="checkbox-list"></div></div></div>

  <button onclick="clearAllFilters()">Clear All</button>
  <button onclick="downloadView()">Download View</button>
</div>

<div id="columnSelector" class="col-panel"></div>

<div class="col-panel">
  <h3>Additional Filters</h3>
  <div id="dynamicFilters"></div>
</div>

<table id="productTable" class="display"></table>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<script>
let table;
let colIndex = {};
const numericFilters = new Map();

/* ===== Robust CSV parser (CRLF-safe) ===== */
function parseCSV(text){
  const rows=[], row=[];
  let cur='', inQuotes=false;

  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];

    if(c === '"' && inQuotes && n === '"'){ cur+='"'; i++; continue; }
    if(c === '"'){ inQuotes=!inQuotes; continue; }

    if(c === ',' && !inQuotes){ row.push(cur); cur=''; continue; }

    if((c === '\n' || c === '\r') && !inQuotes){
      if(c === '\r' && n === '\n') i++;
      row.push(cur); rows.push(row.splice(0)); cur='';
      continue;
    }

    cur+=c;
  }
  if(cur || row.length){ row.push(cur); rows.push(row); }
  return rows;
}

/* ===== Column groups by HEADER NAME ===== */
const COLUMN_GROUPS = [
  { name:'Displays', headers:[
    'Driver Display Size (in)','Centre Display Size (in)','Passenger Display Size (in)'
  ], default:true },

  { name:'Media', headers:[
    'FM Radio','DAB','Satellite Radio','Streaming Media'
  ]},

  { name:'Navigation', headers:[
    'Built-in Navigation','EV Routing','OTA Map Updates'
  ]}
];

/* ===== Header mappings ===== */
const REQUIRED_TOP_HEADERS = {
  region:'Region',
  make:'Make',
  vehicleSegment:'Vehicle Segment',
  priceSegment:'Price Segment'
};

const REQUIRED_ADDITIONAL_HEADERS = {
  os:'Operating System',
  centre:'Centre Screen Size (in)',
  passenger:'Passenger Screen Size (in)'
};

/* ===== Scoped numeric filter ===== */
$.fn.dataTable.ext.search.push(function(settings,data){
  if(!table || settings.nTable !== table.table().node()) return true;

  for(const [col,st] of numericFilters){
    if(!table.column(col).visible()) continue;
    const v=parseFloat(data[col]);
    if(isNaN(v) || v<st.min || v>st.max) return false;
  }
  return true;
});

/* ===== Load data ===== */
async function loadData(){
  const csv = await (await fetch(
    'https://docs.google.com/spreadsheets/d/e/2PACX-1vRmRu1_HWep8KGgPJPAITrGn9ljdlTtFjrx85qAAzeiSZfC9ecKX8T0aSE9rt6vYLdZZ1ZTW-VpJyHg/pub?output=csv'
  )).text();

  const [headers,...data]=parseCSV(csv);

  headers.forEach((h,i)=>colIndex[h.trim()]=i);

  document.getElementById('productTable').innerHTML =
    `<thead><tr>${headers.map(h=>`<th>${escapeHtmlText(h)}</th>`).join('')}</tr></thead>
     <tbody>${data.map(r=>`<tr>${headers.map((_,i)=>`<td>${escapeHtmlText(r[i]??'')}</td>`).join('')}</tr>`).join('')}</tbody>`;

  table=$('#productTable').DataTable({scrollX:true,pageLength:25});

  Object.entries(REQUIRED_TOP_HEADERS).forEach(([_,h],i)=>{
    buildDropdownForColumn(colIndex[h],Object.keys(REQUIRED_TOP_HEADERS)[i]+'Filter');
  });

  buildColumnSelector(headers);
  setInitialVisibility();
  renderAdditionalFilters();
}

/* ===== Column selector ===== */
function buildColumnSelector(headers){
  const root=document.getElementById('columnSelector');

  root.innerHTML=`<h3>Select to Display</h3><div class="col-groups">${
    COLUMN_GROUPS.map(g=>{
      const cols=g.headers.map(h=>colIndex[h]).filter(i=>i!=null);
      return `<div class="col-group">
        <div class="group-head"><input type="checkbox" class="group-toggle" ${g.default?'checked':''}> ${g.name}</div>
        <div class="cols">${
          cols.map(i=>`<label><input type="checkbox" class="col-toggle" data-i="${i}" ${g.default?'checked':''}>${escapeHtmlText(headers[i])}</label>`).join('')
        }</div>
      </div>`;
    }).join('')
  }</div>`;

  root.onchange=e=>{
    if(e.target.classList.contains('group-toggle')){
      const g=e.target.closest('.col-group');
      g.querySelectorAll('.col-toggle').forEach(cb=>{
        cb.checked=e.target.checked;
        table.column(+cb.dataset.i).visible(cb.checked,false);
      });
    }
    if(e.target.classList.contains('col-toggle')){
      table.column(+e.target.dataset.i).visible(e.target.checked,false);
    }
    table.columns.adjust().draw(false);
    renderAdditionalFilters();
  };
}

/* ===== Initial visibility ===== */
function setInitialVisibility(){
  table.columns().visible(false,false);

  Object.values(REQUIRED_TOP_HEADERS)
    .map(h=>colIndex[h]).filter(i=>i!=null)
    .forEach(i=>table.column(i).visible(true,false));

  COLUMN_GROUPS.filter(g=>g.default)
    .flatMap(g=>g.headers.map(h=>colIndex[h]))
    .filter(i=>i!=null)
    .forEach(i=>table.column(i).visible(true,false));

  table.columns.adjust().draw(false);
}

/* ===== Dropdown filter ===== */
function buildDropdownForColumn(col,id){
  if(col==null) return;
  const root=document.getElementById(id);
  root.dataset.col=col;
  const box=root.querySelector('.checkbox-list');
  const sel=root.querySelector('.select-all');

  const vals=[...new Set(table.column(col).data().toArray())].filter(v=>v);
  box.innerHTML=vals.map(v=>`<label><input type="checkbox" value="${escapeHtmlAttr(v)}" checked>${escapeHtmlText(v)}</label>`).join('');

  sel.onchange=()=>{ box.querySelectorAll('input').forEach(cb=>cb.checked=sel.checked); applyDropdownFilter(id); };
  box.querySelectorAll('input').forEach(cb=>cb.onchange=()=>applyDropdownFilter(id));
}

function applyDropdownFilter(id){
  const c=document.getElementById(id);
  const col=+c.dataset.col;
  const vals=[...c.querySelectorAll('input[type=checkbox]:checked')].map(x=>escapeRegex(x.value));
  const r=vals.length?`^(${vals.join('|')})$`:'(?!)';
  table.column(col).search(r,true,false).draw();
}

/* ===== Additional numeric filters ===== */
function renderAdditionalFilters(){
  const root=document.getElementById('dynamicFilters');
  root.innerHTML=''; numericFilters.clear();

  addNumericFilter('Centre Screen Size (in)',colIndex[REQUIRED_ADDITIONAL_HEADERS.centre],0.1);
  addNumericFilter('Passenger Screen Size (in)',colIndex[REQUIRED_ADDITIONAL_HEADERS.passenger],0.1);
}

function addNumericFilter(label,col,step){
  if(col==null||!table.column(col).visible()) return;

  const vals=table.column(col).data().toArray().map(v=>+v).filter(v=>!isNaN(v));
  if(!vals.length) return;

  const min=Math.min(...vals), max=Math.max(...vals);
  numericFilters.set(col,{min,max});

  const d=document.createElement('div');
  d.className='range-filter';
  d.innerHTML=`<strong>${label}</strong>
    <input type="range" min="${min}" max="${max}" step="${step}" value="${min}">
    <input type="range" min="${min}" max="${max}" step="${step}" value="${max}">`;

  const [a,b]=d.querySelectorAll('input');
  a.oninput=b.oninput=()=>{ numericFilters.set(col,{min:+Math.min(a.value,b.value),max:+Math.max(a.value,b.value)}); table.draw(); };
  root.appendChild(d);
}

/* ===== Utilities ===== */
function downloadView(){ /* unchanged */ }
function clearAllFilters(){ location.reload(); }

document.addEventListener('click',e=>{
  const b=e.target.closest('.dropdown-btn');
  if(b){ b.parentElement.classList.toggle('open'); return; }
  document.querySelectorAll('.dropdown-filter').forEach(d=>d.classList.remove('open'));
});

function escapeRegex(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function escapeHtmlText(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function escapeHtmlAttr(s){return escapeHtmlText(s);}

loadData();
</script>

</body>
</html>
