<meta name="robots" content="noindex, nofollow">
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Feature Audits</title>

  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />
  <style>
    body { font-family: sans-serif; padding: 20px; }

    .filters {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .dropdown-filter { position: relative; width: 250px; }

    .dropdown-btn {
      background: #f1f1f1;
      padding: 10px;
      border: 1px solid #ccc;
      cursor: pointer;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      top: 100%;
      left: 0; right: 0;
      background: white;
      border: 1px solid #ccc;
      z-index: 1000;
      max-height: 300px;
      overflow-y: auto;
      padding: 10px;
    }

    .dropdown-filter.open .dropdown-content { display: block; }

    .range-filter {
      display: none;
      flex-direction: column;
      width: 260px;
      gap: 6px;
      padding: 10px;
      border: 1px solid #ccc;
      background: #fafafa;
    }

    button {
      margin-left: auto;
      padding: 10px 12px;
      border: 1px solid #ccc;
      background: #f1f1f1;
      cursor: pointer;
      height: fit-content;
    }

    .col-selector {
      width: 100%;
      border: 1px solid #ccc;
      background: #fff;
      padding: 12px;
    }

    .col-groups {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
    }

    .col-group {
      border: 1px solid #e0e0e0;
      background: #fafafa;
      padding: 10px;
    }

    .group-head { font-weight: 600; margin-bottom: 8px; }
    .cols { padding-left: 16px; }
    label { display: flex; gap: 6px; cursor: pointer; }

    table { width: 100%; }
  </style>
</head>
<body>

<h2>Feature Audit</h2>

<div class="filters">
  <div id="regionFilter" class="dropdown-filter">
    <div class="dropdown-btn">Filter by Region</div>
    <div class="dropdown-content">
      <label><input type="checkbox" class="select-all" checked> Select All</label>
      <div class="checkbox-list"></div>
    </div>
  </div>

  <div id="makeFilter" class="dropdown-filter">
    <div class="dropdown-btn">Filter by Make</div>
    <div class="dropdown-content">
      <label><input type="checkbox" class="select-all" checked> Select All</label>
      <div class="checkbox-list"></div>
    </div>
  </div>

  <div id="centreSlider" class="range-filter">
    <label>Centre Screen Size (in):
      <span id="centreMinVal"></span> – <span id="centreMaxVal"></span>
    </label>
    <input type="range" id="centreMin" step="0.1">
    <input type="range" id="centreMax" step="0.1">
  </div>

  <div id="passengerSlider" class="range-filter">
    <label>Passenger Screen Size (in):
      <span id="passMinVal"></span> – <span id="passMaxVal"></span>
    </label>
    <input type="range" id="passMin" step="0.1">
    <input type="range" id="passMax" step="0.1">
  </div>

  <button onclick="clearAllFilters()">Clear All</button>
  <button onclick="downloadView()">Download View</button>

</div>

<div id="columnSelector" class="col-selector"></div>
<br>

<table id="productTable" class="display"></table>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<script>
let table;

const CENTRE_COL = 8;     // I
const PASSENGER_COL = 10; // K

const COLUMN_GROUPS = [
  { name:'Displays', letters:['H','I','J','K','L','M','N','O','P'], default:true },
  { name:'Media', letters:['Q','R','S','T'] },
  { name:'Phone/Device', letters:['U','V','X','Y','Z'] },
  { name:'Navigation', letters:['AB','AC','AD','AE'] },
  { name:'Connectivity', letters:['W','AA','AF','AG','AH','AK'] },
  { name:'System', letters:['F','G','AI','AJ'] }
];

function colIndex(c){ return [...c].reduce((n,l)=>n*26+l.charCodeAt()-64,0)-1 }

$.fn.dataTable.ext.search.push(() => true);

async function loadData(){
  const csv = await (await fetch(
    'https://docs.google.com/spreadsheets/d/e/2PACX-1vRmRu1_HWep8KGgPJPAITrGn9ljdlTtFjrx85qAAzeiSZfC9ecKX8T0aSE9rt6vYLdZZ1ZTW-VpJyHg/pub?output=csv'
  )).text();

  const rows = csv.trim().split('\n').map(r=>r.split(','));
  const [headers,...data]=rows;

  document.getElementById('productTable').innerHTML =
    `<thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
     <tbody>${data.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>`;

  table = $('#productTable').DataTable({scrollX:true,pageLength:25});

  buildColumnSelector(headers);
  applyDefaultVisibility();
  updateSlidersVisibility();
}

function buildColumnSelector(headers){
  const root=document.getElementById('columnSelector');
  root.innerHTML=`<h3>Select to Display</h3><div class="col-groups">${
    COLUMN_GROUPS.map(g=>{
      const cols=g.letters.map(l=>{
        const i=colIndex(l);
        return `<label><input type="checkbox" class="col" data-i="${i}" ${g.default?'checked':''}>${headers[i]}</label>`;
      }).join('');
      return `<div class="col-group">
        <div class="group-head"><label>
        <input type="checkbox" class="group" ${g.default?'checked':''}> ${g.name}</label></div>
        <div class="cols">${cols}</div></div>`;
    }).join('')
  }</div>`;

  root.addEventListener('change',e=>{
    if(e.target.classList.contains('group')){
      const cols=e.target.closest('.col-group').querySelectorAll('.col');
      cols.forEach(c=>{
        c.checked=e.target.checked;
        table.column(+c.dataset.i).visible(c.checked,false);
      });
    }
    if(e.target.classList.contains('col')){
      table.column(+e.target.dataset.i).visible(e.target.checked,false);
    }
    table.columns.adjust().draw(false);
    updateSlidersVisibility();
  });
}

function applyDefaultVisibility(){
  COLUMN_GROUPS.forEach(g=>{
    g.letters.forEach(l=>{
      table.column(colIndex(l)).visible(!!g.default,false);
    });
  });
  table.draw(false);
}

function updateSlidersVisibility(){
  document.getElementById('centreSlider').style.display =
    table.column(CENTRE_COL).visible() ? 'flex' : 'none';

  document.getElementById('passengerSlider').style.display =
    table.column(PASSENGER_COL).visible() ? 'flex' : 'none';
}

function downloadView() {
  const visibleColumns = table.columns(':visible').indexes().toArray();

  // Get headers for visible columns
  const headers = visibleColumns.map(idx =>
    table.column(idx).header().textContent.trim()
  );

  // Get filtered rows (all pages)
  const rows = table.rows({ search: 'applied' }).data().toArray();

  const csvRows = [];
  csvRows.push(headers.join(','));

  rows.forEach(row => {
    const csvRow = visibleColumns.map(idx => {
      let cell = row[idx] ?? '';
      cell = cell.toString().replace(/"/g, '""');
      if (cell.search(/("|,|\n)/g) >= 0) {
        cell = `"${cell}"`;
      }
      return cell;
    });
    csvRows.push(csvRow.join(','));
  });

  const csvContent = csvRows.join('\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'feature-audit-view.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

}

function clearAllFilters(){
  location.reload();

}

loadData();
</script>

</body>
</html>
