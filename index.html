<meta name="robots" content="noindex, nofollow">
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Feature Matrix with Checkbox Filters</title>

  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }

    .filters {
      background: #f1f1f1;
      padding: 15px;
      border: 1px solid #ccc;
      margin-bottom: 20px;
    }

    .filter-group {
      margin-bottom: 15px;
    }

    .filter-group label {
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
    }

    .filter-group .checkboxes {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .filter-group .checkboxes label {
      font-weight: normal;
    }

    .filter-group .checkboxes input {
      margin-right: 5px;
    }

    button {
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h2>UDS Infotainment Feature Audit</h2>

  <div class="filters">
    <div id="filter-region" class="filter-group"></div>
    <div id="filter-make" class="filter-group"></div>
    <!-- Add more filters here if needed -->
    <button onclick="clearAllFilters()">Clear All Filters</button>
  </div>

  <table id="productTable" class="display" style="width:100%"></table>

  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

  <script>
    let table;

    async function loadData() {
      const response = await fetch(
        'https://docs.google.com/spreadsheets/d/e/2PACX-1vRmRu1_HWep8KGgPJPAITrGn9ljdlTtFjrx85qAAzeiSZfC9ecKX8T0aSE9rt6vYLdZZ1ZTW-VpJyHg/pub?output=csv'
      );
      const csvText = await response.text();

      const rows = csvText
        .trim()
        .split('\n')
        .map(row => row.split(','))
        .filter(row => row.length > 1);

      const [headers, ...data] = rows;

      // Build table HTML
      const thead = '<thead><tr>' + headers.map(h => `<th>${h}</th>`).join('') + '</tr></thead>';
      const tbody = '<tbody>' + data.map(row =>
        `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`
      ).join('') + '</tbody>';

      document.getElementById('productTable').innerHTML = thead + tbody;

      // Initialize DataTable
      table = $('#productTable').DataTable({
        paging: true,
        searching: true,
        scrollX: true,
        destroy: true,
        pageLength: 25
      });

      // Setup filters for Region (col 0) and Make (col 1)
      createCheckboxFilter(0, 'Region', 'filter-region');
      createCheckboxFilter(1, 'Make', 'filter-make');
    }

    function createCheckboxFilter(colIndex, label, containerId) {
      const column = table.column(colIndex);
      const values = column.data().unique().sort();

      const container = document.getElementById(containerId);
      container.innerHTML = `<label>${label}</label><div class="checkboxes"></div>`;
      const checkboxArea = container.querySelector('.checkboxes');

      // Add "Select All"
      const allId = `${containerId}-all`;
      const allWrapper = document.createElement('div');
      allWrapper.innerHTML = `<label><input type="checkbox" id="${allId}" checked> Select All</label>`;
      checkboxArea.appendChild(allWrapper);

      // Add checkboxes for each unique value
      values.each(val => {
        const safeVal = val.replace(/"/g, '&quot;');
        const optionId = `${containerId}-${safeVal}`;
        const wrapper = document.createElement('div');
        wrapper.innerHTML = `<label><input type="checkbox" class="${containerId}-option" value="${safeVal}" checked> ${val}</label>`;
        checkboxArea.appendChild(wrapper);
      });

      // Handle filtering
      $(`#${containerId} input[type="checkbox"]`).on('change', () => applyFilters());
    }

    function applyFilters() {
      // Region
      const regionValues = getCheckedValues('filter-region-option');
      table.column(0).search(regionValues.length ? regionValues.join('|') : '', true, false);

      // Make
      const makeValues = getCheckedValues('filter-make-option');
      table.column(1).search(makeValues.length ? makeValues.join('|') : '', true, false);

      table.draw();
    }

    function getCheckedValues(className) {
      return $(`.${className}:checked`).map(function () {
        return $.fn.dataTable.util.escapeRegex($(this).val());
      }).get();
    }

    function clearAllFilters() {
      $('.filters input[type=checkbox]').prop('checked', true);
      applyFilters();
    }

    loadData();
  </script>

</body>
</html>
