<meta name="robots" content="noindex, nofollow">
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Feature Audit</title>

<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />

<style>
body { font-family:sans-serif; font-size:14px; padding:20px; }
h2 { font-size:18px; margin-bottom:12px; }
h3 { font-size:15px; margin-bottom:10px; }

.filters { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:16px; }

.dropdown-filter { position:relative; width:220px; }
.dropdown-btn { background:#f1f1f1; padding:8px; border:1px solid #ccc; cursor:pointer; }

.dropdown-content {
  display:none;
  position:absolute;
  top:100%;
  left:0; right:0;
  background:#fff;
  border:1px solid #ccc;
  z-index:1000;
  max-height:240px;
  overflow-y:auto;
  padding:8px;
}

.dropdown-filter.open .dropdown-content { display:block; }

.range-filter {
  display:flex;
  flex-direction:column;
  gap:6px;
  padding:10px;
  border:1px solid #ccc;
  background:#fafafa;
  max-width:420px;
  margin-bottom:12px;
}

.col-panel { border:1px solid #ccc; padding:12px; margin-top:12px; }

.col-groups {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:12px;
}

.col-group { border:1px solid #e0e0e0; padding:10px; background:#fafafa; }
.group-head { font-weight:600; margin-bottom:8px; }
.cols { padding-left:18px; display:flex; flex-direction:column; gap:6px; }

label { display:flex; gap:6px; cursor:pointer; }
button { padding:8px 10px; border:1px solid #ccc; background:#f1f1f1; cursor:pointer; }
table { width:100%; }
</style>
</head>

<body>

<h2>Feature Audit</h2>

<div class="filters">
  <div id="regionFilter" class="dropdown-filter">
    <div class="dropdown-btn">Region</div>
    <div class="dropdown-content">
      <label><input type="checkbox" class="select-all" checked> Select All</label>
      <div class="checkbox-list"></div>
    </div>
  </div>

  <div id="makeFilter" class="dropdown-filter">
    <div class="dropdown-btn">Make</div>
    <div class="dropdown-content">
      <label><input type="checkbox" class="select-all" checked> Select All</label>
      <div class="checkbox-list"></div>
    </div>
  </div>

  <div id="vehicleSegmentFilter" class="dropdown-filter">
    <div class="dropdown-btn">Vehicle Segment</div>
    <div class="dropdown-content">
      <label><input type="checkbox" class="select-all" checked> Select All</label>
      <div class="checkbox-list"></div>
    </div>
  </div>

  <div id="priceSegmentFilter" class="dropdown-filter">
    <div class="dropdown-btn">Price Segment</div>
    <div class="dropdown-content">
      <label><input type="checkbox" class="select-all" checked> Select All</label>
      <div class="checkbox-list"></div>
    </div>
  </div>

  <button onclick="clearAllFilters()">Clear All</button>
  <button onclick="downloadView()">Download View</button>
</div>

<div id="columnSelector" class="col-panel"></div>

<div class="col-panel">
  <h3>Additional Filters</h3>
  <div id="dynamicFilters"></div>
</div>

<table id="productTable" class="display"></table>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<script>
let table;

/* ===== CSV PARSER (FIXED) ===== */
function parseCSV(text){
  const rows=[], row=[];
  let cur='', inQuotes=false;

  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];

    if(c === '"' && inQuotes && n === '"'){ cur+='"'; i++; continue; }
    if(c === '"'){ inQuotes=!inQuotes; continue; }

    if(c === ',' && !inQuotes){
      row.push(cur); cur=''; continue;
    }

    if((c === '\n' || c === '\r') && !inQuotes){
      if(cur || row.length){
        row.push(cur);
        rows.push(row.splice(0));
        cur='';
      }
      continue;
    }

    cur+=c;
  }
  if(cur || row.length){
    row.push(cur);
    rows.push(row);
  }
  return rows;
}

/* ===== COLUMN INDEXING ===== */
function excelColToIndex(col){
  return [...col].reduce((n,l)=>n*26+l.charCodeAt()-64,0)-1;
}

const REGION_COL=0, MAKE_COL=1, VEHICLE_SEG_COL=3, PRICE_SEG_COL=4;
const OPERATING_SYSTEM_COL=excelColToIndex('F');
const CENTRE_COL=excelColToIndex('I');
const PASSENGER_COL=excelColToIndex('K');

/* ===== COLUMN GROUPS ===== */
const COLUMN_GROUPS=[
  {name:'Displays',letters:['H','I','J','K','L','M','N','O','P'],default:true},
  {name:'Media',letters:['Q','R','S','T']},
  {name:'Phone/Device',letters:['U','V','X','Y','Z']},
  {name:'Navigation',letters:['AB','AC','AD','AE']},
  {name:'Connectivity',letters:['W','AA','AF','AG','AH','AK']},
  {name:'System',letters:['F','G','AI','AJ']}
];

const numericFilters=new Map();

/* ===== DATATABLE FILTER EXTENSION ===== */
$.fn.dataTable.ext.search.push((settings,data)=>{
  for(const [col,st] of numericFilters){
    if(!table.column(col).visible()) continue;
    const v=parseFloat(data[col]);
    if(isNaN(v)||v<st.min||v>st.max) return false;
  }
  return true;
});

/* ===== LOAD DATA ===== */
async function loadData(){
  const csv=await (await fetch(
    'https://docs.google.com/spreadsheets/d/e/2PACX-1vRmRu1_HWep8KGgPJPAITrGn9ljdlTtFjrx85qAAzeiSZfC9ecKX8T0aSE9rt6vYLdZZ1ZTW-VpJyHg/pub?output=csv'
  )).text();

  const rows=parseCSV(csv);
  const [headers,...data]=rows;

  document.getElementById('productTable').innerHTML=
    `<thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
     <tbody>${data.map(r=>`<tr>${headers.map((_,i)=>`<td>${r[i]||''}</td>`).join('')}</tr>`).join('')}</tbody>`;

  table=$('#productTable').DataTable({scrollX:true,pageLength:25});

  buildDropdown(REGION_COL,'regionFilter');
  buildDropdown(MAKE_COL,'makeFilter');
  buildDropdown(VEHICLE_SEG_COL,'vehicleSegmentFilter');
  buildDropdown(PRICE_SEG_COL,'priceSegmentFilter');

  buildColumnSelector(headers);
  applyDefaultVisibility();
  renderAdditionalFilters();
  table.draw(false);
}

/* ===== TOP DROPDOWNS ===== */
function buildDropdown(col,id){
  const box=document.querySelector(`#${id} .checkbox-list`);
  if(!box) return;

  const values=[...new Set(table.column(col).data().toArray())].sort();
  box.innerHTML='';
  values.forEach(v=>{
    box.innerHTML+=`<label><input type="checkbox" value="${v}" checked>${v}</label>`;
  });

  document.querySelectorAll(`#${id} input`).forEach(i=>{
    i.onchange=applyTopFilters;
  });
}

function applyTopFilters(){
  [[REGION_COL,'regionFilter'],[MAKE_COL,'makeFilter'],
   [VEHICLE_SEG_COL,'vehicleSegmentFilter'],[PRICE_SEG_COL,'priceSegmentFilter']]
  .forEach(([c,id])=>{
    const vals=[...document.querySelectorAll(`#${id} input:checked`)]
      .filter(v=>v.value)
      .map(v=>v.value);
    table.column(c).search(vals.join('|'),true,false);
  });
  table.draw();
}

/* ===== COLUMN SELECTOR ===== */
function buildColumnSelector(headers){
  const root=document.getElementById('columnSelector');
  root.innerHTML=`<h3>Select to Display</h3><div class="col-groups">${
    COLUMN_GROUPS.map(g=>`
      <div class="col-group">
        <div class="group-head">
          <input type="checkbox" class="group-toggle" ${g.default?'checked':''}> ${g.name}
        </div>
        <div class="cols">
          ${g.letters.map(l=>{
            const i=excelColToIndex(l);
            return `<label><input type="checkbox" class="col-toggle" data-i="${i}" ${g.default?'checked':''}>${headers[i]}</label>`;
          }).join('')}
        </div>
      </div>`).join('')
  }</div>`;

  root.onchange=e=>{
    if(e.target.classList.contains('group-toggle')){
      e.target.closest('.col-group').querySelectorAll('.col-toggle').forEach(cb=>{
        cb.checked=e.target.checked;
        table.column(+cb.dataset.i).visible(cb.checked,false);
      });
    }
    if(e.target.classList.contains('col-toggle')){
      table.column(+e.target.dataset.i).visible(e.target.checked,false);
    }
    table.columns.adjust().draw(false);
    renderAdditionalFilters();
  };
}

function applyDefaultVisibility(){
  COLUMN_GROUPS.forEach(g=>{
    g.letters.forEach(l=>{
      table.column(excelColToIndex(l)).visible(!!g.default,false);
    });
  });
}

/* ===== ADDITIONAL FILTERS ===== */
function renderAdditionalFilters(){
  const root=document.getElementById('dynamicFilters');
  root.innerHTML='';
  numericFilters.clear();

  if(table.column(OPERATING_SYSTEM_COL).visible()){
    const d=document.createElement('div');
    d.id='osFilter';
    d.className='dropdown-filter open';
    d.innerHTML=`
      <div class="dropdown-btn">Operating System</div>
      <div class="dropdown-content" style="display:block">
        <label><input type="checkbox" class="select-all" checked> Select All</label>
        <div class="checkbox-list"></div>
      </div>`;
    root.appendChild(d);
    buildDropdown(OPERATING_SYSTEM_COL,'osFilter');
  }

  addNumericFilter('Centre Screen Size (in)',CENTRE_COL,0.1);
  addNumericFilter('Passenger Screen Size (in)',PASSENGER_COL,0.1);
}

function addNumericFilter(label,col,step){
  if(!table.column(col).visible()) return;

  const vals=table.column(col).data().toArray().map(v=>parseFloat(v)).filter(v=>!isNaN(v));
  if(!vals.length) return;

  const min=Math.min(...vals), max=Math.max(...vals);
  numericFilters.set(col,{min,max});

  const d=document.createElement('div');
  d.className='range-filter';
  d.innerHTML=`<strong>${label}</strong>
    <input type="range" min="${min}" max="${max}" step="${step}" value="${min}">
    <input type="range" min="${min}" max="${max}" step="${step}" value="${max}">`;

  const [minR,maxR]=d.querySelectorAll('input');
  minR.oninput=maxR.oninput=()=>{
    numericFilters.set(col,{min:+minR.value,max:+maxR.value});
    table.draw();
  };

  document.getElementById('dynamicFilters').appendChild(d);
}

/* ===== EXPORT / RESET ===== */
function downloadView(){
  const cols=table.columns(':visible').indexes().toArray();
  const rows=table.rows({search:'applied'}).data().toArray();
  const out=[cols.map(i=>table.column(i).header().textContent).join(',')];
  rows.forEach(r=>{
    out.push(cols.map(i=>`"${(r[i]||'').replace(/"/g,'""')}"`).join(','));
  });
  const blob=new Blob([out.join('\n')],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='feature-audit-view.csv';
  a.click();
}

function clearAllFilters(){ location.reload(); }

document.addEventListener('click',e=>{
  const b=e.target.closest('.dropdown-btn');
  if(b){ b.parentElement.classList.toggle('open'); return; }
  document.querySelectorAll('.dropdown-filter').forEach(d=>d.classList.remove('open'));
});

loadData();
</script>

</body>
</html>
