<meta name="robots" content="noindex, nofollow">
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow">
  <title>Feature Audits</title>

  <!-- DataTables -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />

  <!-- noUiSlider (REQUIRED for visible sliders) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nouislider@15.7.1/dist/nouislider.min.css" />

  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 20px;
    }

    .dropdown-filter {
      position: relative;
      width: 240px;
    }

    .dropdown-btn {
      background: #f1f1f1;
      padding: 10px;
      border: 1px solid #ccc;
      cursor: pointer;
      user-select: none;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: white;
      border: 1px solid #ccc;
      z-index: 1000;
      max-height: 320px;
      overflow-y: auto;
      padding: 10px;
    }

    .dropdown-filter.open .dropdown-content {
      display: block;
    }

    .checkbox-list label {
      display: block;
      margin-bottom: 4px;
      cursor: pointer;
    }

    .slider-wrapper {
      margin-top: 10px;
    }

    .slider-inputs {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .slider-inputs input {
      width: 50%;
      padding: 4px;
    }

    table {
      width: 100%;
    }
  </style>
</head>

<body>

<h2>Feature Audit with Dropdown Filters & Sliders</h2>

<div class="filters">

  <!-- REGION -->
  <div id="regionFilter" class="dropdown-filter">
    <div class="dropdown-btn">Filter by Region</div>
    <div class="dropdown-content">
      <input type="text" placeholder="Search..." onkeyup="filterCheckboxList(this)">
      <label><input type="checkbox" class="select-all" checked> Select All</label>
      <div class="checkbox-list"></div>
    </div>
  </div>

  <!-- MAKE -->
  <div id="makeFilter" class="dropdown-filter">
    <div class="dropdown-btn">Filter by Make</div>
    <div class="dropdown-content">
      <input type="text" placeholder="Search..." onkeyup="filterCheckboxList(this)">
      <label><input type="checkbox" class="select-all" checked> Select All</label>
      <div class="checkbox-list"></div>
    </div>
  </div>

  <!-- SLIDERS -->
  <div class="dropdown-filter">
    <div class="dropdown-btn">Filter Column I</div>
    <div class="dropdown-content">
      <div id="slider-8" class="slider-wrapper"></div>
      <div class="slider-inputs">
        <input id="min-8" type="number">
        <input id="max-8" type="number">
      </div>
    </div>
  </div>

  <div class="dropdown-filter">
    <div class="dropdown-btn">Filter Column K</div>
    <div class="dropdown-content">
      <div id="slider-10" class="slider-wrapper"></div>
      <div class="slider-inputs">
        <input id="min-10" type="number">
        <input id="max-10" type="number">
      </div>
    </div>
  </div>

  <div class="dropdown-filter">
    <div class="dropdown-btn">Filter Column M</div>
    <div class="dropdown-content">
      <div id="slider-12" class="slider-wrapper"></div>
      <div class="slider-inputs">
        <input id="min-12" type="number">
        <input id="max-12" type="number">
      </div>
    </div>
  </div>

  <div class="dropdown-filter">
    <div class="dropdown-btn">Filter Column O</div>
    <div class="dropdown-content">
      <div id="slider-14" class="slider-wrapper"></div>
      <div class="slider-inputs">
        <input id="min-14" type="number">
        <input id="max-14" type="number">
      </div>
    </div>
  </div>

  <button onclick="clearAllFilters()">Clear All</button>
</div>

<table id="productTable" class="display"></table>

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nouislider@15.7.1/dist/nouislider.min.js"></script>

<script>
let table;
let sliderRanges = {};

async function loadData() {
  const res = await fetch(
    'https://docs.google.com/spreadsheets/d/e/2PACX-1vRmRu1_HWep8KGgPJPAITrGn9ljdlTtFjrx85qAAzeiSZfC9ecKX8T0aSE9rt6vYLdZZ1ZTW-VpJyHg/pub?output=csv'
  );
  const csv = await res.text();

  const rows = csv.trim().split('\n').map(r => r.split(','));
  const [headers, ...data] = rows;

  document.getElementById('productTable').innerHTML =
    '<thead><tr>' + headers.map(h => `<th>${h}</th>`).join('') + '</tr></thead>' +
    '<tbody>' + data.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('') + '</tbody>';

  table = $('#productTable').DataTable({
    scrollX: true,
    pageLength: 25
  });

  createDropdownCheckboxes(0, 'regionFilter');
  createDropdownCheckboxes(1, 'makeFilter');

  createSlider(8);
  createSlider(10);
  createSlider(12);
  createSlider(14);
}

function createDropdownCheckboxes(colIndex, id) {
  const values = table.column(colIndex).data().unique().sort().toArray();
  const container = document.querySelector(`#${id} .checkbox-list`);
  container.innerHTML = '';

  values.forEach(v => {
    container.innerHTML += `<label><input class="filter-option" type="checkbox" value="${v}" checked> ${v}</label>`;
  });

  container.querySelectorAll('input').forEach(i => i.onchange = applyFilters);
  document.querySelector(`#${id} .select-all`).onchange = e => {
    container.querySelectorAll('input').forEach(cb => cb.checked = e.target.checked);
    applyFilters();
  };
}

function createSlider(col) {
  const values = table.column(col).data().map(Number).filter(v => !isNaN(v));
  const min = Math.min(...values);
  const max = Math.max(...values);

  sliderRanges[col] = [min, max];

  const slider = document.getElementById(`slider-${col}`);
  const minInput = document.getElementById(`min-${col}`);
  const maxInput = document.getElementById(`max-${col}`);

  noUiSlider.create(slider, {
    start: [min, max],
    connect: true,
    range: { min, max },
    step: 1
  });

  slider.noUiSlider.on('update', v => {
    minInput.value = Math.round(v[0]);
    maxInput.value = Math.round(v[1]);
    sliderRanges[col] = [Number(v[0]), Number(v[1])];
    applyFilters();
  });
}

$.fn.dataTable.ext.search.push(function (settings, data) {
  return Object.entries(sliderRanges).every(([col, range]) => {
    const v = Number(data[col]);
    return !isNaN(v) && v >= range[0] && v <= range[1];
  });
});

function applyFilters() {
  ['regionFilter','makeFilter'].forEach((id,i) => {
    const vals = [...document.querySelectorAll(`#${id} .filter-option:checked`)]
      .map(cb => $.fn.dataTable.util.escapeRegex(cb.value));
    table.column(i).search(vals.length ? vals.join('|') : '', true, false);
  });
  table.draw();
}

function clearAllFilters() {
  document.querySelectorAll('.filter-option,.select-all').forEach(cb => cb.checked = true);
  Object.keys(sliderRanges).forEach(c => sliderRanges[c] = sliderRanges[c]);
  applyFilters();
}

function filterCheckboxList(input) {
  const q = input.value.toLowerCase();
  input.closest('.dropdown-content')
    .querySelectorAll('.checkbox-list label')
    .forEach(l => l.style.display = l.textContent.toLowerCase().includes(q) ? '' : 'none');
}

document.addEventListener('click', e => {
  document.querySelectorAll('.dropdown-filter').forEach(d => {
    if (!d.contains(e.target)) d.classList.remove('open');
  });
  if (e.target.classList.contains('dropdown-btn')) {
    e.target.parentElement.classList.toggle('open');
  }
});

loadData();
</script>

</body>
</html>
