<meta name="robots" content="noindex, nofollow">
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Excel-Style Filtered Dashboard</title>

  <!-- DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />

  <!-- YADCF CSS for Excel-style filters -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/yadcf@0.9.4/jquery.dataTables.yadcf.css" />

  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }
    table {
      width: 100%;
    }
  </style>
</head>
<body>

  <h2>Product Dashboard with Excel-Style Filters</h2>
  <button onclick="clearFilters()">Clear All Filters</button>
  <table id="productTable" class="display" style="width:100%"></table>

  <!-- jQuery + DataTables -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

  <!-- YADCF plugin -->
  <script src="https://cdn.jsdelivr.net/npm/yadcf@0.9.4/jquery.dataTables.yadcf.js"></script>

  <script>
    let table;

    async function loadData() {
      const response = await fetch(
        'https://docs.google.com/spreadsheets/d/e/2PACX-1vRmRu1_HWep8KGgPJPAITrGn9ljdlTtFjrx85qAAzeiSZfC9ecKX8T0aSE9rt6vYLdZZ1ZTW-VpJyHg/pub?output=csv'
      );
      const csvText = await response.text();

      const rows = csvText
        .trim()
        .split('\n')
        .map(row => row.split(','))
        .filter(row => row.length > 1);

      const [headers, ...data] = rows;

      // Build table structure
      const thead = '<thead><tr>' + headers.map(h => `<th>${h}</th>`).join('') + '</tr></thead>';
      const tbody = '<tbody>' + data.map(row =>
        `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`
      ).join('') + '</tbody>';

      document.getElementById('productTable').innerHTML = thead + tbody;

      table = $('#productTable').DataTable({
        paging: true,
        searching: true,
        scrollX: true,
        destroy: true,
        pageLength: 25
      });

      // Apply YADCF filters on specific columns
      yadcf.init(table, [
        {
          column_number: 0, // e.g. Region
          filter_type: 'multi_select',
          select_type: 'select2', // optional: fancier dropdowns
          filter_default_label: "Select Region"
        },
        {
          column_number: 1, // e.g. Make
          filter_type: 'multi_select',
          select_type: 'select2',
          filter_default_label: "Select Make"
        },
        // Add more filters like this for other columns if needed
      ]);
    }

    function clearFilters() {
      yadcf.exResetAllFilters(table);
    }

    loadData();
  </script>

</body>
</html>
