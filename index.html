<meta name="robots" content="noindex, nofollow">
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Feature Audit</title>

<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />

<style>
body { font-family:sans-serif; font-size:14px; padding:20px; }
h2 { font-size:18px; }
h3 { font-size:15px; }

.filters {
  display:flex;
  gap:16px;
  flex-wrap:wrap;
  margin-bottom:16px;
}

.dropdown-filter {
  position:relative;
  width:220px;
}

.dropdown-btn {
  background:#f1f1f1;
  padding:8px;
  border:1px solid #ccc;
  cursor:pointer;
}

.dropdown-content {
  display:none;
  position:absolute;
  top:100%;
  left:0; right:0;
  background:#fff;
  border:1px solid #ccc;
  z-index:1000;
  max-height:240px;
  overflow-y:auto;
  padding:8px;
}

.dropdown-filter.open .dropdown-content { display:block; }

.range-filter {
  display:none;
  flex-direction:column;
  width:220px;
  gap:4px;
  padding:8px;
  border:1px solid #ccc;
  background:#fafafa;
}

.col-selector {
  border:1px solid #ccc;
  padding:12px;
  margin-top:12px;
}

.col-groups {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
}

.col-group {
  border:1px solid #e0e0e0;
  padding:8px;
  background:#fafafa;
}

.group-head { font-weight:600; margin-bottom:6px; }
.cols { padding-left:14px; }

label { display:flex; gap:6px; cursor:pointer; }

button {
  padding:8px 10px;
  border:1px solid #ccc;
  background:#f1f1f1;
  cursor:pointer;
}

table { width:100%; }
</style>
</head>

<body>

<h2>Feature Audit</h2>

<!-- TOP FILTERS -->
<div class="filters">
  <div id="regionFilter" class="dropdown-filter">
    <div class="dropdown-btn">Region</div>
    <div class="dropdown-content">
      <label><input type="checkbox" class="select-all" checked> Select All</label>
      <div class="checkbox-list"></div>
    </div>
  </div>

  <div id="makeFilter" class="dropdown-filter">
    <div class="dropdown-btn">Make</div>
    <div class="dropdown-content">
      <label><input type="checkbox" class="select-all" checked> Select All</label>
      <div class="checkbox-list"></div>
    </div>
  </div>

  <div id="vehicleSegmentFilter" class="dropdown-filter">
    <div class="dropdown-btn">Vehicle Segment</div>
    <div class="dropdown-content">
      <label><input type="checkbox" class="select-all" checked> Select All</label>
      <div class="checkbox-list"></div>
    </div>
  </div>

  <div id="priceSegmentFilter" class="dropdown-filter">
    <div class="dropdown-btn">Price Segment</div>
    <div class="dropdown-content">
      <label><input type="checkbox" class="select-all" checked> Select All</label>
      <div class="checkbox-list"></div>
    </div>
  </div>

  <button onclick="clearAllFilters()">Clear All</button>
  <button onclick="downloadView()">Download View</button>
</div>

<!-- COLUMN GROUPING -->
<div id="columnSelector" class="col-selector"></div>

<!-- ADDITIONAL FILTERS -->
<div class="col-selector">
  <h3>Additional Filters</h3>
  <div id="dynamicFilters"></div>
</div>

<table id="productTable" class="display"></table>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<script>
let table;

/* COLUMN INDICES */
const REGION_COL = 0;
const MAKE_COL = 1;
const VEHICLE_SEGMENT_COL = 2;
const PRICE_SEGMENT_COL = 3;
const OPERATING_SYSTEM_COL = 6;
const CENTRE_COL = 8;
const PASSENGER_COL = 10;

/* COLUMN GROUPS */
const COLUMN_GROUPS = [
 {name:'Displays',letters:['H','I','J','K','L','M','N','O','P'],default:true},
 {name:'Media',letters:['Q','R','S','T']},
 {name:'Phone/Device',letters:['U','V','X','Y','Z']},
 {name:'Navigation',letters:['AB','AC','AD','AE']},
 {name:'Connectivity',letters:['W','AA','AF','AG','AH','AK']},
 {name:'System',letters:['F','G','AI','AJ']}
];

function colIndex(c){
  return [...c].reduce((n,l)=>n*26+l.charCodeAt()-64,0)-1;
}

/* DATA LOAD */
async function loadData(){
  const csv = await (await fetch(
    'https://docs.google.com/spreadsheets/d/e/2PACX-1vRmRu1_HWep8KGgPJPAITrGn9ljdlTtFjrx85qAAzeiSZfC9ecKX8T0aSE9rt6vYLdZZ1ZTW-VpJyHg/pub?output=csv'
  )).text();

  const rows = csv.trim().split('\n').map(r=>r.split(','));
  const [headers,...data]=rows;

  document.getElementById('productTable').innerHTML =
    `<thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
     <tbody>${data.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>`;

  table = $('#productTable').DataTable({scrollX:true,pageLength:25});

  createDropdown(REGION_COL,'regionFilter');
  createDropdown(MAKE_COL,'makeFilter');
  createDropdown(VEHICLE_SEGMENT_COL,'vehicleSegmentFilter');
  createDropdown(PRICE_SEGMENT_COL,'priceSegmentFilter');

  buildColumnSelector(headers);
  applyDefaultVisibility();
  renderAdditionalFilters();
}

/* DROPDOWNS */
function createDropdown(col, id){
  const box=document.querySelector(`#${id} .checkbox-list`);
  const values=table.column(col).data().unique().sort().toArray();
  box.innerHTML='';
  values.forEach(v=>{
    box.innerHTML+=`<label><input type="checkbox" value="${v}" checked>${v}</label>`;
  });
  document.querySelectorAll(`#${id} input`).forEach(i=>{
    i.onchange=()=>applyFilters();
  });
}

/* FILTER APPLY */
function applyFilters(){
  [REGION_COL,MAKE_COL,VEHICLE_SEGMENT_COL,PRICE_SEGMENT_COL].forEach((c,i)=>{
    const id=['regionFilter','makeFilter','vehicleSegmentFilter','priceSegmentFilter'][i];
    const vals=[...document.querySelectorAll(`#${id} input:checked`)].map(v=>v.value);
    table.column(c).search(vals.join('|'),true,false);
  });
  table.draw();
}

/* COLUMN SELECTOR */
function buildColumnSelector(headers){
  const root=document.getElementById('columnSelector');
  root.innerHTML=`<h3>Select to Display</h3><div class="col-groups">${
    COLUMN_GROUPS.map(g=>{
      return `<div class="col-group">
        <div class="group-head"><label>
        <input type="checkbox" ${g.default?'checked':''} data-group="${g.name}">
        ${g.name}</label></div>
        <div class="cols">${
          g.letters.map(l=>{
            const i=colIndex(l);
            return `<label><input type="checkbox" class="col-toggle" data-i="${i}" ${g.default?'checked':''}>
            ${headers[i]}</label>`;
          }).join('')
        }</div></div>`;
    }).join('')
  }</div>`;

  root.onchange=e=>{
    if(e.target.dataset.i){
      table.column(+e.target.dataset.i).visible(e.target.checked,false);
    }
    table.columns.adjust().draw(false);
    renderAdditionalFilters();
  };
}

/* ADDITIONAL FILTERS */
function renderAdditionalFilters(){
  const c=document.getElementById('dynamicFilters');
  c.innerHTML='';
  if(table.column(OPERATING_SYSTEM_COL).visible()){
    c.innerHTML+=`<div class="dropdown-filter open">
      <div class="dropdown-btn">Operating System</div>
      <div class="dropdown-content" style="display:block">
        <div id="osFilter"></div>
      </div></div>`;
    createDropdown(OPERATING_SYSTEM_COL,'osFilter');
  }
}

/* DOWNLOAD */
function downloadView(){
  const cols=table.columns(':visible').indexes().toArray();
  const rows=table.rows({search:'applied'}).data().toArray();
  const out=[cols.map(i=>table.column(i).header().textContent).join(',')];
  rows.forEach(r=>{
    out.push(cols.map(i=>`"${(r[i]||'').replace(/"/g,'""')}"`).join(','));
  });
  const blob=new Blob([out.join('\n')],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='feature-audit-view.csv';
  a.click();
}

function clearAllFilters(){ location.reload(); }

loadData();
</script>

</body>
</html>
