<meta name="robots" content="noindex, nofollow">
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Excel-style Filters Dashboard</title>

  <!-- DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />

  <!-- YADCF CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/yadcf@0.9.4/jquery.dataTables.yadcf.css" />

  <!-- Select2 CSS (required for nice dropdowns with checkboxes) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" />

  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }

    table {
      width: 100%;
    }

    .yadcf-filter-wrapper {
      margin-top: 4px;
    }

    .select2-container {
      width: 100% !important;
    }
  </style>
</head>
<body>

  <h2>Product Dashboard with Excel-style Filters</h2>
  <button onclick="clearFilters()">Clear All Filters</button>

  <table id="productTable" class="display" style="width:100%"></table>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

  <!-- DataTables JS -->
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

  <!-- Select2 JS -->
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

  <!-- YADCF JS -->
  <script src="https://cdn.jsdelivr.net/npm/yadcf@0.9.4/jquery.dataTables.yadcf.min.js"></script>

  <script>
    let table;

    async function loadData() {
      const response = await fetch(
        'https://docs.google.com/spreadsheets/d/e/2PACX-1vRmRu1_HWep8KGgPJPAITrGn9ljdlTtFjrx85qAAzeiSZfC9ecKX8T0aSE9rt6vYLdZZ1ZTW-VpJyHg/pub?output=csv'
      );
      const csvText = await response.text();

      const rows = csvText
        .trim()
        .split('\n')
        .map(row => row.split(','))
        .filter(row => row.length > 1);

      const [headers, ...data] = rows;

      // Build table header and body
      const thead = '<thead><tr>' + headers.map(h => `<th>${h}</th>`).join('') + '</tr></thead>';
      const tbody = '<tbody>' + data.map(row =>
        `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`
      ).join('') + '</tbody>';

      document.getElementById('productTable').innerHTML = thead + tbody;

      // Initialize DataTable
      table = $('#productTable').DataTable({
        paging: true,
        searching: true,
        scrollX: true,
        destroy: true,
        pageLength: 25
      });

      // Wait a moment before applying filters
      setTimeout(() => {
        yadcf.init(table, [
          {
            column_number: 0, // Region
            filter_type: 'multi_select',
            select_type: 'select2',
            filter_default_label: 'Filter Region'
          },
          {
            column_number: 1, // Make
            filter_type: 'multi_select',
            select_type: 'select2',
            filter_default_label: 'Filter Make'
          },
          {
            column_number: 2, // Example: Model or Type
            filter_type: 'multi_select',
            select_type: 'select2',
            filter_default_label: 'Filter Type'
          }
        ]);
      }, 200); // wait for DataTable to render fully
    }

    function clearFilters() {
      yadcf.exResetAllFilters(table);
    }

    loadData();
  </script>

</body>
</html>
