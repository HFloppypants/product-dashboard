<!DOCTYPE html>
<html>
<head>
  <title>Slider Test</title>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nouislider@15.7.1/dist/nouislider.min.css">
  <style>
    .slider-label { font-weight: bold; }
    .slider-container { margin-bottom: 20px; width: 300px; }
  </style>
</head>
<body>
  <h2>Slider + Table Filter Test</h2>

  <div class="slider-container">
    <div class="slider-label">Filter by Price</div>
    <div id="slider-price"></div>
  </div>

  <table id="myTable" class="display" style="width:100%">
    <thead>
      <tr><th>Product</th><th>Price</th></tr>
    </thead>
    <tbody>
      <tr><td>Item A</td><td>10</td></tr>
      <tr><td>Item B</td><td>20</td></tr>
      <tr><td>Item C</td><td>30</td></tr>
      <tr><td>Item D</td><td>40</td></tr>
    </tbody>
  </table>

  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nouislider@15.7.1/distribute/nouislider.min.js"></script>
  <script>
    let table;

    $(document).ready(function () {
      table = $('#myTable').DataTable();

      // Create slider
      const slider = document.getElementById('slider-price');
      noUiSlider.create(slider, {
        start: [0, 50],
        connect: true,
        range: { min: 0, max: 50 },
        step: 1
      });

      // Filter table on slider update
      slider.noUiSlider.on('update', function (values) {
        const min = parseFloat(values[0]);
        const max = parseFloat(values[1]);

        $.fn.dataTable.ext.search = [
          function (settings, data) {
            const price = parseFloat(data[1]) || 0; // Column 1 = Price
            return price >= min && price <= max;
          }
        ];

        table.draw();
      });
    });
  </script>
</body>
</html>
