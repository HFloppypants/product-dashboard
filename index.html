<meta name="robots" content="noindex, nofollow">
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow">
  <title>Feature Audit with Filters & Sliders</title>

  <!-- DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />

  <!-- noUiSlider CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nouislider@15.7.1/dist/nouislider.min.css" />

  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 20px;
      align-items: flex-start;
    }

    .dropdown-filter {
      position: relative;
      width: 240px;
    }

    .dropdown-btn {
      background: #f1f1f1;
      padding: 10px;
      border: 1px solid #ccc;
      cursor: pointer;
      user-select: none;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: white;
      border: 1px solid #ccc;
      z-index: 1000;
      max-height: 300px;
      overflow-y: auto;
      padding: 10px;
    }

    .dropdown-filter.open .dropdown-content {
      display: block;
    }

    .checkbox-list label {
      display: block;
      margin-bottom: 4px;
      cursor: pointer;
    }

    .slider-wrapper {
      margin-top: 10px;
      padding: 5px;
    }

    .slider-inputs {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .slider-inputs input {
      width: 50%;
      padding: 4px;
    }

    table {
      width: 100%;
    }

    button {
      height: 40px;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<h2>Feature Audit with Dropdown Filters & Sliders</h2>

<div class="filters">

  <!-- Region Filter -->
  <div id="regionFilter" class="dropdown-filter">
    <div class="dropdown-btn">Filter by Region</div>
    <div class="dropdown-content">
      <input type="text" placeholder="Search..." onkeyup="filterCheckboxList(this)">
      <label><input type="checkbox" class="select-all" checked> Select All</label>
      <div class="checkbox-list"></div>
    </div>
  </div>

  <!-- Make Filter -->
  <div id="makeFilter" class="dropdown-filter">
    <div class="dropdown-btn">Filter by Make</div>
    <div class="dropdown-content">
      <input type="text" placeholder="Search..." onkeyup="filterCheckboxList(this)">
      <label><input type="checkbox" class="select-all" checked> Select All</label>
      <div class="checkbox-list"></div>
    </div>
  </div>

  <!-- Sliders -->
  <div class="dropdown-filter">
    <div class="dropdown-btn">Centre Screen Size (Col I)</div>
    <div class="dropdown-content">
      <div id="slider-8" class="slider-wrapper"></div>
    </div>
  </div>

  <div class="dropdown-filter">
    <div class="dropdown-btn">Cluster Size (Col K)</div>
    <div class="dropdown-content">
      <div id="slider-10" class="slider-wrapper"></div>
    </div>
  </div>

  <div class="dropdown-filter">
    <div class="dropdown-btn"># Speakers (Col M)</div>
    <div class="dropdown-content">
      <div id="slider-12" class="slider-wrapper"></div>
    </div>
  </div>

  <div class="dropdown-filter">
    <div class="dropdown-btn"># USB (Col O)</div>
    <div class="dropdown-content">
      <div id="slider-14" class="slider-wrapper"></div>
    </div>
  </div>

  <button onclick="clearAllFilters()">Clear All</button>
</div>

<table id="productTable" class="display"></table>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nouislider@15.7.1/dist/nouislider.min.js"></script>

<script>
let table;
let sliderRanges = {};

async function loadData() {
  const res = await fetch('https://docs.google.com/spreadsheets/d/e/2PACX-1vRmRu1_HWep8KGgPJPAITrGn9ljdlTtFjrx85qAAzeiSZfC9ecKX8T0aSE9rt6vYLdZZ1ZTW-VpJyHg/pub?output=csv');
  const csv = await res.text();

  const rows = csv.trim().split('\n').map(r => r.split(','));
  const [headers, ...data] = rows;

  document.getElementById('productTable').innerHTML =
    '<thead><tr>' + headers.map(h => `<th>${h}</th>`).join('') + '</tr></thead>' +
    '<tbody>' + data.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('') + '</tbody>';

  table = $('#productTable').DataTable({
    scrollX: true,
    pageLength: 25
  });

  createDropdownCheckboxes(0, 'regionFilter');
  createDropdownCheckboxes(1, 'makeFilter');

  createSlider(8);
  createSlider(10);
  createSlider(12);
  createSlider(14);
}

function createDropdownCheckboxes(colIndex, id) {
  const values = table.column(colIndex).data().unique().sort().toArray();
  const container = document.querySelector(`#${id} .checkbox-list`);
  container.innerHTML = '';

  values.forEach(v => {
    container.innerHTML += `<label><input class="filter-option" type="checkbox" value="${v}" checked> ${v}</label>`;
  });

  container.querySelectorAll('input').forEach(i => i.onchange = applyFilters);
  document.querySelector(`#${id} .select-all`).onchange = e => {
    container.querySelectorAll('input').forEach(cb => cb.checked = e.target.checked);
    applyFilters();
  };
}

function createSlider(colIndex) {
  const values = table.column(colIndex).data().map(val => parseFloat(val)).filter(v => !isNaN(v));
  const min = Math.min(...values);
  const max = Math.max(...values);

  sliderRanges[colIndex] = [min, max];

  const sliderElem = document.getElementById(`slider-${colIndex}`);
  if (!sliderElem) return;

  noUiSlider.create(sliderElem, {
    start: [min, max],
    connect: true,
    step: 1,
    range: { min, max }
  });

  sliderElem.noUiSlider.on('update', function (values) {
    sliderRanges[colIndex] = values.map(v => parseFloat(v));
    table.draw();
  });
}

// Add custom filtering for sliders
$.fn.dataTable.ext.search.push(function (settings, data) {
  for (const [colIndex, [min, max]] of Object.entries(sliderRanges)) {
    const val = parseFloat(data[colIndex]);
    if (isNaN(val) || val < min || val > max) return false;
  }
  return true;
});

function applyFilters() {
  ['regionFilter','makeFilter'].forEach((id, i) => {
    const checked = [...document.querySelectorAll(`#${id} .filter-option:checked`)]
      .map(cb => $.fn.dataTable.util.escapeRegex(cb.value));
    table.column(i).search(checked.length ? checked.join('|') : '', true, false);
  });
  table.draw();
}

function clearAllFilters() {
  document.querySelectorAll('.filter-option,.select-all').forEach(cb => cb.checked = true);
  Object.keys(sliderRanges).forEach(index => {
    const slider = document.getElementById(`slider-${index}`).noUiSlider;
    const [min, max] = slider.get();
    slider.set([min, max]); // Reset slider (or could save original values)
  });
  applyFilters();
}

function filterCheckboxList(input) {
  const val = input.value.toLowerCase();
  input.closest('.dropdown-content').querySelectorAll('.checkbox-list label').forEach(label => {
    label.style.display = label.textContent.toLowerCase().includes(val) ? '' : 'none';
  });
}

// Dropdown toggle
document.addEventListener('click', e => {
  document.querySelectorAll('.dropdown-filter').forEach(d => {
    if (!d.contains(e.target)) d.classList.remove('open');
  });
  if (e.target.classList.contains('dropdown-btn')) {
    e.target.parentElement.classList.toggle('open');
  }
});

loadData();
</script>

</body>
</html>
