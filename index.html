<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex, nofollow">
<title>Infotainment Feature Audit</title>

<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />

<style>
/* ======================================================
   Design Tokens
   ====================================================== */
:root {
  --uds-primary: #005c5c;
  --uds-primary-dark: #004747;
  --uds-secondary: #02c256;
  --uds-secondary-dark: #02a94c;
  --uds-text-primary: #0c2c56;
  --uds-text-secondary: #4a5a6a;
  --uds-border-light: #c4ced4;
  --uds-bg-soft: #fafafa;
}

/* ======================================================
   Base
   ====================================================== */
body {
  font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 14px;
  padding: 20px;
  color: var(--uds-text-primary);
}

h2 {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 12px;
}

h3 {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 10px;
}

/* ======================================================
   Top Filters
   ====================================================== */
.filters {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}

.dropdown-filter {
  position: relative;
  width: 220px;
}

.dropdown-btn {
  background: #ffffff;
  padding: 8px;
  border: 1px solid var(--uds-border-light);
  border-radius: 10px;
  cursor: pointer;
  font-weight: 500;
  color: var(--uds-text-primary);
}

.dropdown-content {
  display: none;
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background: #ffffff;
  border: 1px solid var(--uds-border-light);
  border-radius: 10px;
  z-index: 1000;
  max-height: 240px;
  overflow-y: auto;
  padding: 8px;
}

.dropdown-filter.open .dropdown-content {
  display: block;
}

/* Checkbox accent */
input[type="checkbox"] {
  accent-color: var(--uds-primary);
}

/* ======================================================
   Range Filters
   ====================================================== */
.range-filter {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px;
  border: 1px solid var(--uds-border-light);
  border-radius: 10px;
  background: var(--uds-bg-soft);
  max-width: 420px;
}

input[type="range"] {
  accent-color: var(--uds-primary);
}

.range-values {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--uds-text-secondary);
  margin-bottom: 4px;
}

.range-values .current-val {
  font-weight: 600;
  color: var(--uds-text-primary);
}

/* ======================================================
   Panels
   ====================================================== */
.col-panel {
  border: 1px solid var(--uds-border-light);
  border-radius: 10px;
  padding: 14px;
  margin-top: 12px;
  margin-bottom: 24px;
  background: #ffffff;
}

/* ======================================================
   Column Group Selector
   ====================================================== */
.col-groups {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 12px;
}

.col-group {
  border: 1px solid var(--uds-border-light);
  border-radius: 10px;
  padding: 10px;
  background: var(--uds-bg-soft);
}

.group-head {
  font-weight: 600;
  margin-bottom: 8px;
}

.cols {
  padding-left: 18px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

/* ======================================================
   Form Elements
   ====================================================== */
label {
  display: flex;
  gap: 6px;
  cursor: pointer;
  font-size: 13px;
}

/* Buttons – base */
button {
  padding: 8px 14px;
  border-radius: 10px;
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  border: none;
  transition: background-color 0.15s ease;
}

/* Primary action (Download, Sign in, Export) */
.btn-primary,
button.primary {
  background: var(--uds-primary);
  color: #ffffff;
}

.btn-primary:hover,
button.primary:hover {
  background: var(--uds-primary-dark);
}

/* Secondary / intermediate actions (Clear, Reset) */
.btn-secondary,
button.secondary {
  background: var(--uds-secondary);
  color: #ffffff;
}

.btn-secondary:hover,
button.secondary:hover {
  background: var(--uds-secondary-dark);
}

/* Neutral fallback */
button:not(.primary):not(.secondary) {
  background: var(--uds-border-light);
  color: var(--uds-text-primary);
}

/* ======================================================
   Table
   ====================================================== */
table {
  width: 100%;
}

table.dataTable thead th {
  font-weight: 600;
  color: var(--uds-text-primary);
}

/* ======================================================
   Error Box
   ====================================================== */
#errorBox {
  display: none;
  border: 1px solid #d33;
  background: #fff3f3;
  padding: 10px;
  margin-bottom: 16px;
  white-space: pre-wrap;
  font-family: monospace;
}

/* ======================================================
   DataTables Fixes
   ====================================================== */

/* scrollX header/body width sync */
.dataTables_scrollHeadInner,
.dataTables_scrollBody table {
  width: 100% !important;
}

/* Space between Additional Filters and DataTables controls */
.col-panel + .dataTables_wrapper {
  margin-bottom: 24px;
}

/* Space between search bar and table */
.dataTables_filter {
  margin-bottom: 36px;
}

/* ======================================================
   Additional Filters (Dynamic)
   ====================================================== */
#dynamicFilters {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
  align-items: start;
}

/* Secondary visual treatment */
#dynamicFilters .dropdown-btn {
  background: var(--uds-bg-soft);
  font-weight: 600;
}

#dynamicFilters .dropdown-content {
  max-height: 220px;
}
</style>

</head>

<body>

<h2>UDS Infotainment Feature Audit</h2>

<div id="errorBox"></div>

<div class="filters">
  <div id="regionFilter" class="dropdown-filter">
    <div class="dropdown-btn">Region</div>
    <div class="dropdown-content">
      <label><input type="checkbox" class="select-all" checked> Select All</label>
      <div class="checkbox-list"></div>
    </div>
  </div>

  <div id="makeFilter" class="dropdown-filter">
    <div class="dropdown-btn">Make</div>
    <div class="dropdown-content">
      <label><input type="checkbox" class="select-all" checked> Select All</label>
      <div class="checkbox-list"></div>
    </div>
  </div>

  <div id="vehicleSegmentFilter" class="dropdown-filter">
    <div class="dropdown-btn">Vehicle Segment</div>
    <div class="dropdown-content">
      <label><input type="checkbox" class="select-all" checked> Select All</label>
      <div class="checkbox-list"></div>
    </div>
  </div>

  <div id="priceSegmentFilter" class="dropdown-filter">
    <div class="dropdown-btn">Price Segment</div>
    <div class="dropdown-content">
      <label><input type="checkbox" class="select-all" checked> Select All</label>
      <div class="checkbox-list"></div>
    </div>
  </div>

  <button onclick="clearAllFilters()">Clear All</button>
  <button onclick="downloadView()">Download View</button>
</div>

<div id="columnSelector" class="col-panel"></div>

<div class="col-panel">
  <h3>Filters for Selected Columns</h3>
  <div id="dynamicFilters"></div>
</div>

<table id="productTable" class="display"></table>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<script>
let table;
let colIndex = {};
const numericFilters = new Map();

const COLUMN_GROUPS = [
  {
    name: 'Displays',
    headers: [
      'Panoramic Display',
      'Centre Screen Size (in)',
      'Passenger Display',
      'Passenger Display Size (in)',
      'Rear Screens',
      'Rear Screen Size (in)',
      'Cluster Type',
      'Cluster Size (in)',
      'HUD'
    ],
  },
  {
    name:'Media',
    headers:['Premium Audio','# Speakers','Integrated Streaming Services','Broadcast Radio']
  },
  {
    name:'Navigation & Mapping',
    headers:['Integrated Nav','HD Maps','AR Nav','EV Route Planning']
  },
  {
    name:'Connected Features',
    headers:['Integrated Voice Assistant','WiFi Hotspot','In-Vehicle Commerce','Integrated App Store','Digital Key','OTA Updates','Connected Services Brand Name']
  },
  {
    name:'Mobile Integration',
    headers:['Apple CarPlay','Android Auto','Wireless Phone Charging']
  },
  {
    name:'System',
    headers:['Operating System','Google Built-In','Cellular Modem','# USB (A)','# USB (C)']
  },
];

const REQUIRED_TOP_HEADERS = {
  region:'Region',
  make:'Make',
  model:'Model',
  vehicleSegment:'Vehicle Segment',
  priceSegment:'Price Segment'
};

const REQUIRED_ADDITIONAL_HEADERS = {
  os:'Operating System',
  centre:'Centre Screen Size (in)',
  passenger:'Passenger Display Size (in)'
};

function showError(msg){
  const box = document.getElementById('errorBox');
  box.style.display = 'block';
  box.textContent = msg;
}

function parseCSV(text){
  const rows = [], row=[];
  let cur='', inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if(c === '"' && inQuotes && n === '"'){ cur+='"'; i++; continue; }
    if(c === '"'){ inQuotes=!inQuotes; continue; }
    if(c === ',' && !inQuotes){ row.push(cur); cur=''; continue; }
    if((c === '\n' || c === '\r') && !inQuotes){
      if(c === '\r' && n === '\n') i++;
      row.push(cur); rows.push(row.splice(0)); cur=''; continue;
    }
    cur+=c;
  }
  if(cur || row.length){ row.push(cur); rows.push(row); }
  return rows;
}

$.fn.dataTable.ext.search.push(function(settings,data){
  if(!table || settings.nTable !== table.table().node()) return true;
  for(const [col,st] of numericFilters){
    if(!table.column(col).visible()) continue;
    const v = parseFloat(String(data[col] ?? '').trim());
    if(isNaN(v) || v<st.min || v>st.max) return false;
  }
  return true;
});

async function loadData(){
  try{
    const url='https://docs.google.com/spreadsheets/d/e/2PACX-1vRmRu1_HWep8KGgPJPAITrGn9ljdlTtFjrx85qAAzeiSZfC9ecKX8T0aSE9rt6vYLdZZ1ZTW-VpJyHg/pub?output=csv';
    const resp=await fetch(url);
    if(!resp.ok) throw new Error('CSV fetch failed: HTTP '+resp.status);
    const csv=await resp.text();
    const rows=parseCSV(csv);
    if(!rows.length) throw new Error('No CSV data found.');

    const [rawHeaders,...data]=rows;
    const headers = rawHeaders.map((h,i)=>String(h ?? '').trim() || `Column ${i}`);
    colIndex={};
    headers.forEach((h,i)=>colIndex[h]=i);

    document.getElementById('productTable').innerHTML =
      `<thead><tr>${headers.map(h=>`<th>${escapeHtmlText(h)}</th>`).join('')}</tr></thead>
       <tbody>${data.map(r=>`<tr>${headers.map((_,i)=>`<td>${escapeHtmlText(r[i] ?? '')}</td>`).join('')}</tr>`).join('')}</tbody>`;

    table=$('#productTable').DataTable({ scrollX:true, pageLength:25 });

    buildDropdownForHeader(REQUIRED_TOP_HEADERS.region,'regionFilter');
    buildDropdownForHeader(REQUIRED_TOP_HEADERS.make,'makeFilter');
    buildDropdownForHeader(REQUIRED_TOP_HEADERS.vehicleSegment,'vehicleSegmentFilter');
    buildDropdownForHeader(REQUIRED_TOP_HEADERS.priceSegment,'priceSegmentFilter');

    buildColumnSelector(headers);
    setInitialVisibility(headers);
table.columns.adjust();
table.draw(false);

$(table.table().container())
  .find('.dataTables_scrollHead table, .dataTables_scrollBody table')
  .css('width', '100%');

renderAdditionalFilters();

  }catch(err){
    console.error(err);
    showError(String(err && err.stack ? err.stack : err));
  }
}

function buildDropdownForHeader(header,containerId){
  const idx=colIndex[header];
  if(idx==null) return;
  buildDropdownForColumn(idx,containerId);
}

function buildDropdownForColumn(col,id){
  const container=document.getElementById(id);
  if(!container||col==null) return;
  container.dataset.col=col;
  const box=container.querySelector('.checkbox-list');
  const sel=container.querySelector('.select-all');
  if(!box||!sel) return;

  const values=[...new Set(table.column(col).data().toArray())]
    .map(v=>String(v).trim()).filter(v=>v.length).sort();

  box.innerHTML=values.map(v=>`<label><input type="checkbox" value="${escapeHtmlAttr(v)}" checked>${escapeHtmlText(v)}</label>`).join('');

  sel.onchange=()=>{ box.querySelectorAll('input').forEach(cb=>cb.checked=sel.checked); applyDropdownFilter(id); };
  box.querySelectorAll('input').forEach(cb=>cb.onchange=()=>applyDropdownFilter(id));
}

function applyDropdownFilter(id){
  const container=document.getElementById(id);
  if(!container) return;
  const col=Number(container.dataset.col);
  const box=container.querySelector('.checkbox-list');
  if(!box||Number.isNaN(col)) return;

  const vals=[...box.querySelectorAll('input[type="checkbox"]:checked')].map(x=>escapeRegex(x.value));
  const regex=vals.length?`^(${vals.join('|')})$`:'(?!)';
  table.column(col).search(regex,true,false).draw();
}

function buildColumnSelector(headers){
  const root=document.getElementById('columnSelector');
  const groupsResolved=COLUMN_GROUPS.map(g=>{
    const cols=(g.headers||[]).map(h=>colIndex[h]).filter(i=>i!=null);
    return {...g,cols};
  });

  root.innerHTML=`<h3>Select to Display</h3><div class="col-groups">${
    groupsResolved.map(g=>`
      <div class="col-group">
        <div class="group-head">
          <input type="checkbox" class="group-toggle" ${g.default?'checked':''}> ${escapeHtmlText(g.name)}
        </div>
        <div class="cols">${
          g.cols.length
            ? g.cols.map(i=>`<label><input type="checkbox" class="col-toggle" data-i="${i}" ${g.default?'checked':''}>${escapeHtmlText(headers[i])}</label>`).join('')
            : `<em style="opacity:0.75;">(no matching columns)</em>`
        }</div>
      </div>
    `).join('')
  }</div>`;

  root.onchange=e=>{
    if(e.target.classList.contains('group-toggle')){
      const group=e.target.closest('.col-group');
      group.querySelectorAll('.col-toggle').forEach(cb=>{
        cb.checked=e.target.checked;
        table.column(+cb.dataset.i).visible(cb.checked,false);
      });
    }
    if(e.target.classList.contains('col-toggle')){
      table.column(+e.target.dataset.i).visible(e.target.checked,false);
    }
    table.columns.adjust();
table.draw(false);

// HARD sync header/body widths
$(table.table().container())
  .find('.dataTables_scrollHead table, .dataTables_scrollBody table')
  .css('width', '100%');

    renderAdditionalFilters();
  };
}

function setInitialVisibility(headers){
  table.columns().visible(false,false);

  Object.values(REQUIRED_TOP_HEADERS)
    .map(h=>colIndex[h]).filter(i=>i!=null)
    .forEach(i=>table.column(i).visible(true,false));

table.columns.adjust();
table.draw(false);

$(table.table().container())
  .find('.dataTables_scrollHead table, .dataTables_scrollBody table')
  .css('width', '100%');


// HARD sync header/body widths
$(table.table().container())
  .find('.dataTables_scrollHead table, .dataTables_scrollBody table')
  .css('width', '100%');

}

  function isNumericColumn(colIndex) {
  const vals = table.column(colIndex).data().toArray()
    .map(v => parseFloat(String(v).trim()))
    .filter(v => !isNaN(v));
  return vals.length > 0;
}

function renderAdditionalFilters(){
  const root = document.getElementById('dynamicFilters');
  root.innerHTML = '';
  numericFilters.clear();

  // Iterate over ALL visible columns
  table.columns(':visible').indexes().toArray().forEach(col => {
    const header = table.column(col).header().textContent;

    // Skip identity columns (already filtered above)
    if (Object.values(REQUIRED_TOP_HEADERS).includes(header)) return;

    // Numeric → range slider
    if (isNumericColumn(col)) {
      addNumericFilter(header, col, 0.1);
      return;
    }

    // Categorical → dropdown
    const d = document.createElement('div');
    d.id = `filter-${col}`;
    d.className = 'dropdown-filter';
    d.innerHTML = `
        <div class="dropdown-btn">${escapeHtmlText(header)}</div>
        <div class="dropdown-content">
        <label><input type="checkbox" class="select-all" checked> Select All</label>
        <div class="checkbox-list"></div>
      </div>`;
    root.appendChild(d);

    buildDropdownForColumn(col, d.id);
  });
}


function addNumericFilter(label, col, step){
  if (col == null || !table.column(col).visible()) {
    numericFilters.delete(col);
    return;
  }

  const vals = table.column(col).data().toArray()
    .map(v => parseFloat(String(v).trim()))
    .filter(v => !isNaN(v));

  if (!vals.length) return;

  const min = Math.min(...vals);
  const max = Math.max(...vals);

  numericFilters.set(col, { min, max });

  const d = document.createElement('div');
  d.className = 'range-filter';
  d.innerHTML = `
    <strong>${escapeHtmlText(label)}</strong>

    <div class="range-values">
      <span class="min-val">${min}</span>
      <span class="current-val">${min} – ${max}</span>
      <span class="max-val">${max}</span>
    </div>

    <input type="range" min="${min}" max="${max}" step="${step}" value="${min}">
    <input type="range" min="${min}" max="${max}" step="${step}" value="${max}">
  `;

  const [minR, maxR] = d.querySelectorAll('input');
  const current = d.querySelector('.current-val');

  function update(){
    const a = +minR.value;
    const b = +maxR.value;
    const lo = Math.min(a, b);
    const hi = Math.max(a, b);

    numericFilters.set(col, { min: lo, max: hi });
    current.textContent = `${lo} – ${hi}`;
    table.draw();
  }

  minR.oninput = update;
  maxR.oninput = update;

  document.getElementById('dynamicFilters').appendChild(d);
}


function downloadView(){
  const cols=table.columns(':visible').indexes().toArray();
  const rows=table.rows({search:'applied'}).data().toArray();
  const out=[cols.map(i=>table.column(i).header().textContent).join(',')];
  rows.forEach(r=>out.push(cols.map(i=>`"${String(r[i]??'').replace(/"/g,'""')}"`).join(',')));
  const blob=new Blob([out.join('\n')],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='feature-audit-view.csv'; a.click();
}
function clearAllFilters(){ location.reload(); }

document.addEventListener('click', e => {
  const dropdown = e.target.closest('.dropdown-filter');
  const button = e.target.closest('.dropdown-btn');

  // Click on a dropdown button: toggle that dropdown, close others
  if (button) {
    document.querySelectorAll('.dropdown-filter').forEach(d => {
      if (d !== button.parentElement) d.classList.remove('open');
    });
    button.parentElement.classList.toggle('open');
    return;
  }

  // Click inside an open dropdown (checkboxes, labels, scrollbars): do nothing
  if (dropdown) {
    return;
  }

  // Click outside all dropdowns: close everything
  document.querySelectorAll('.dropdown-filter').forEach(d => d.classList.remove('open'));
});


function escapeRegex(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function escapeHtmlText(s){ return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeHtmlAttr(s){ return escapeHtmlText(s); }

loadData();
</script>

</body>
</html>
