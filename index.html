<meta name="robots" content="noindex, nofollow">
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Feature Audit</title>

<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />

<style>
body { font-family:sans-serif; font-size:14px; padding:20px; }
h2 { font-size:18px; margin-bottom:12px; }
h3 { font-size:15px; margin-bottom:10px; }

.filters { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:16px; }

.dropdown-filter { position:relative; width:220px; }
.dropdown-btn { background:#f1f1f1; padding:8px; border:1px solid #ccc; cursor:pointer; }

.dropdown-content {
  display:none;
  position:absolute;
  top:100%;
  left:0; right:0;
  background:#fff;
  border:1px solid #ccc;
  z-index:1000;
  max-height:240px;
  overflow-y:auto;
  padding:8px;
}

.dropdown-filter.open .dropdown-content { display:block; }

.range-filter {
  display:flex;
  flex-direction:column;
  gap:6px;
  padding:10px;
  border:1px solid #ccc;
  background:#fafafa;
  max-width:420px;
  margin-bottom:12px;
}

.col-panel { border:1px solid #ccc; padding:12px; margin-top:12px; }

.col-groups {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:12px;
}

.col-group { border:1px solid #e0e0e0; padding:10px; background:#fafafa; }
.group-head { font-weight:600; margin-bottom:8px; }
.cols { padding-left:18px; display:flex; flex-direction:column; gap:6px; }

label { display:flex; gap:6px; cursor:pointer; }

button { padding:8px 10px; border:1px solid #ccc; background:#f1f1f1; cursor:pointer; }
table { width:100%; }
</style>
</head>

<body>

<h2>Feature Audit</h2>

<!-- TOP FILTERS -->
<div class="filters">
  <div id="regionFilter" class="dropdown-filter">
    <div class="dropdown-btn">Region</div>
    <div class="dropdown-content">
      <label><input type="checkbox" class="select-all" checked> Select All</label>
      <div class="checkbox-list"></div>
    </div>
  </div>

  <div id="makeFilter" class="dropdown-filter">
    <div class="dropdown-btn">Make</div>
    <div class="dropdown-content">
      <label><input type="checkbox" class="select-all" checked> Select All</label>
      <div class="checkbox-list"></div>
    </div>
  </div>

  <div id="vehicleSegmentFilter" class="dropdown-filter">
    <div class="dropdown-btn">Vehicle Segment</div>
    <div class="dropdown-content">
      <label><input type="checkbox" class="select-all" checked> Select All</label>
      <div class="checkbox-list"></div>
    </div>
  </div>

  <div id="priceSegmentFilter" class="dropdown-filter">
    <div class="dropdown-btn">Price Segment</div>
    <div class="dropdown-content">
      <label><input type="checkbox" class="select-all" checked> Select All</label>
      <div class="checkbox-list"></div>
    </div>
  </div>

  <button onclick="clearAllFilters()">Clear All</button>
  <button onclick="downloadView()">Download View</button>
</div>

<!-- COLUMN GROUPING -->
<div id="columnSelector" class="col-panel"></div>

<!-- ADDITIONAL FILTERS -->
<div class="col-panel">
  <h3>Additional Filters</h3>
  <div id="dynamicFilters"></div>
</div>

<table id="productTable" class="display"></table>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<script>
let table;

/* ===== SAFE CSV PARSER (handles quoted commas) ===== */
function parseCSV(text){
  const rows=[], row=[];
  let cur='', inQuotes=false;

  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];

    if(c === '"' && inQuotes && n === '"'){ cur+='"'; i++; continue; }
    if(c === '"'){ inQuotes=!inQuotes; continue; }

    if(c === ',' && !inQuotes){ row.push(cur); cur=''; continue; }

    if((c === '\n' || c === '\r') && !inQuotes){
      if(cur || row.length){
        row.push(cur);
        rows.push(row.splice(0));
        cur='';
      }
      continue;
    }

    cur+=c;
  }

  if(cur || row.length){ row.push(cur); rows.push(row); }
  return rows;
}

/* ===== COLUMN GROUPS (NUMERIC INDICES) =====
   Excel letters converted to numeric indices (A=0, B=1, ... Z=25, AA=26, AB=27, ...)
*/
const COLUMN_GROUPS = [
  { name:'Displays',     cols:[ 7,  8,  9, 10, 11, 12, 13, 14, 15], default:true }, // H..P
  { name:'Media',        cols:[16, 17, 18, 19] },                                     // Q..T
  { name:'Phone/Device', cols:[20, 21, 23, 24, 25] },                                  // U,V,X,Y,Z
  { name:'Navigation',   cols:[27, 28, 29, 30] },                                      // AB..AE
  { name:'Connectivity', cols:[22, 26, 31, 32, 33, 36] },                              // W,AA,AF,AG,AH,AK
  { name:'System',       cols:[ 5,  6, 34, 35] }                                       // F,G,AI,AJ
];

/* ===== Header-driven top filter mapping (fixes misalignment) ===== */
const REQUIRED_TOP_HEADERS = {
  region: 'Region',
  make: 'Make',
  vehicleSegment: 'Vehicle Segment',
  priceSegment: 'Price Segment'
};

const REQUIRED_ADDITIONAL_HEADERS = {
  os: 'Operating System',
  centre: 'Centre Screen Size (in)',
  passenger: 'Passenger Screen Size (in)'
};

let colIndex = {};                 // header -> numeric index
const numericFilters = new Map();  // colIndex -> {min,max}

/* ===== Datatables numeric filter hook ===== */
$.fn.dataTable.ext.search.push(function(settings,data){
  for(const [col,st] of numericFilters){
    if(!table.column(col).visible()) continue;
    const v=parseFloat(data[col]);
    if(isNaN(v) || v<st.min || v>st.max) return false;
  }
  return true;
});

/* ===== LOAD DATA ===== */
async function loadData(){
  const csv = await (await fetch(
    'https://docs.google.com/spreadsheets/d/e/2PACX-1vRmRu1_HWep8KGgPJPAITrGn9ljdlTtFjrx85qAAzeiSZfC9ecKX8T0aSE9rt6vYLdZZ1ZTW-VpJyHg/pub?output=csv'
  )).text();

  const rows = parseCSV(csv);
  const [headers, ...data] = rows;

  // Build header -> index lookup (fixes off-by-one / extra-column issues)
  colIndex = {};
  headers.forEach((h,i)=>{ colIndex[String(h||'').trim()] = i; });

  document.getElementById('productTable').innerHTML =
    `<thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
     <tbody>${data.map(r=>`<tr>${headers.map((_,i)=>`<td>${r[i] ?? ''}</td>`).join('')}</tr>`).join('')}</tbody>`;

  table = $('#productTable').DataTable({scrollX:true,pageLength:25});

  // Build top dropdowns using resolved column indices
  buildDropdownForColumn(colIndex[REQUIRED_TOP_HEADERS.region], 'regionFilter');
  buildDropdownForColumn(colIndex[REQUIRED_TOP_HEADERS.make], 'makeFilter');
  buildDropdownForColumn(colIndex[REQUIRED_TOP_HEADERS.vehicleSegment], 'vehicleSegmentFilter');
  buildDropdownForColumn(colIndex[REQUIRED_TOP_HEADERS.priceSegment], 'priceSegmentFilter');

  buildColumnSelector(headers);

  // Optional: make the starting view predictable by hiding all, then showing top cols + default group
  setInitialVisibility();

  renderAdditionalFilters();
  table.draw(false);
}

/* ===== Dropdown builder for a single column ===== */
function buildDropdownForColumn(col, id){
  const container = document.getElementById(id);
  if(!container || col == null) return;

  container.dataset.col = String(col);

  const box = container.querySelector('.checkbox-list');
  const selectAll = container.querySelector('.select-all');
  if(!box || !selectAll) return;

  const values = [...new Set(table.column(col).data().toArray())]
    .map(v => String(v ?? '').trim())
    .filter(v => v.length)
    .sort();

  box.innerHTML = values.map(v =>
    `<label><input type="checkbox" value="${escapeHtmlAttr(v)}" checked>${escapeHtmlText(v)}</label>`
  ).join('');

  // Select All behavior
  selectAll.onchange = () => {
    const checked = selectAll.checked;
    box.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = checked);
    applyDropdownFilter(id);
  };

  // Individual checkbox behavior
  box.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.onchange = () => {
      const all = [...box.querySelectorAll('input[type="checkbox"]')];
      const allChecked = all.length && all.every(x => x.checked);
      const noneChecked = all.length && all.every(x => !x.checked);
      selectAll.indeterminate = !allChecked && !noneChecked;
      selectAll.checked = allChecked;
      applyDropdownFilter(id);
    };
  });

  // Initialize select-all state
  selectAll.indeterminate = false;
  selectAll.checked = true;
}

/* Apply filter for a single dropdown by its container ID */
function applyDropdownFilter(id){
  const container = document.getElementById(id);
  if(!container) return;

  const col = Number(container.dataset.col);
  const box = container.querySelector('.checkbox-list');
  if(!box || Number.isNaN(col)) return;

  const vals = [...box.querySelectorAll('input[type="checkbox"]:checked')]
    .map(x => x.value)
    .filter(v => v && v.length);

  // If nothing selected, filter to impossible value to show none
  const regex = vals.length ? vals.map(escapeRegex).join('|') : '(?!)';
  table.column(col).search(regex, true, false);

  table.draw();
}

/* ===== COLUMN SELECTOR ===== */
function buildColumnSelector(headers){
  const root = document.getElementById('columnSelector');
  root.innerHTML = `<h3>Select to Display</h3><div class="col-groups">${
    COLUMN_GROUPS.map(g=>`
      <div class="col-group">
        <div class="group-head">
          <input type="checkbox" class="group-toggle" ${g.default?'checked':''}> ${g.name}
        </div>
        <div class="cols">
          ${g.cols.map(i=>{
            const name = headers[i] ?? `Column ${i}`;
            return `<label><input type="checkbox" class="col-toggle" data-i="${i}" ${g.default?'checked':''}>${escapeHtmlText(name)}</label>`;
          }).join('')}
        </div>
      </div>
    `).join('')
  }</div>`;

  root.onchange = e => {
    if(e.target.classList.contains('group-toggle')){
      const group = e.target.closest('.col-group');
      group.querySelectorAll('.col-toggle').forEach(cb=>{
        cb.checked = e.target.checked;
        table.column(+cb.dataset.i).visible(cb.checked, false);
      });
    }

    if(e.target.classList.contains('col-toggle')){
      table.column(+e.target.dataset.i).visible(e.target.checked, false);
    }

    table.columns.adjust().draw(false);
    renderAdditionalFilters();
  };
}

/* Hide all columns, then show top filter columns + default group columns */
function setInitialVisibility(){
  // Hide everything first
  table.columns().visible(false, false);

  // Show top columns (by header mapping)
  const topCols = [
    colIndex[REQUIRED_TOP_HEADERS.region],
    colIndex[REQUIRED_TOP_HEADERS.make],
    colIndex[REQUIRED_TOP_HEADERS.vehicleSegment],
    colIndex[REQUIRED_TOP_HEADERS.priceSegment]
  ].filter(c => c != null);

  topCols.forEach(c => table.column(c).visible(true, false));

  // Show default group columns
  COLUMN_GROUPS.forEach(g=>{
    if(!g.default) return;
    g.cols.forEach(c => table.column(c).visible(true, false));
  });

  table.columns.adjust().draw(false);
}

/* ===== ADDITIONAL FILTERS ===== */
function renderAdditionalFilters(){
  const root = document.getElementById('dynamicFilters');
  root.innerHTML = '';
  numericFilters.clear();

  // Operating System (dropdown)
  const osCol = colIndex[REQUIRED_ADDITIONAL_HEADERS.os];
  if(osCol != null && table.column(osCol).visible()){
    const d = document.createElement('div');
    d.id = 'osFilter';
    d.className = 'dropdown-filter open';
    d.innerHTML = `
      <div class="dropdown-btn">Operating System</div>
      <div class="dropdown-content" style="display:block">
        <label><input type="checkbox" class="select-all" checked> Select All</label>
        <div class="checkbox-list"></div>
      </div>`;
    root.appendChild(d);
    buildDropdownForColumn(osCol, 'osFilter');
  }

  // Numeric sliders
  addNumericFilter('Centre Screen Size (in)', colIndex[REQUIRED_ADDITIONAL_HEADERS.centre], 0.1);
  addNumericFilter('Passenger Screen Size (in)', colIndex[REQUIRED_ADDITIONAL_HEADERS.passenger], 0.1);
}

function addNumericFilter(label, col, step){
  if(col == null || !table.column(col).visible()){
    numericFilters.delete(col);
    return;
  }

  const vals = table.column(col).data().toArray()
    .map(v => parseFloat(String(v ?? '').trim()))
    .filter(v => !isNaN(v));

  if(!vals.length) return;

  const min = Math.min(...vals);
  const max = Math.max(...vals);

  numericFilters.set(col, {min, max});

  const d = document.createElement('div');
  d.className = 'range-filter';
  d.innerHTML = `
    <strong>${escapeHtmlText(label)}</strong>
    <input type="range" min="${min}" max="${max}" step="${step}" value="${min}">
    <input type="range" min="${min}" max="${max}" step="${step}" value="${max}">
  `;

  const [minR, maxR] = d.querySelectorAll('input');

  minR.oninput = maxR.oninput = () => {
    const a = +minR.value, b = +maxR.value;
    numericFilters.set(col, {min: Math.min(a,b), max: Math.max(a,b)});
    table.draw();
  };

  document.getElementById('dynamicFilters').appendChild(d);
}

/* ===== DOWNLOAD ===== */
function downloadView(){
  const cols = table.columns(':visible').indexes().toArray();
  const rows = table.rows({search:'applied'}).data().toArray();

  const out = [cols.map(i=>table.column(i).header().textContent).join(',')];
  rows.forEach(r=>{
    out.push(cols.map(i=>`"${String(r[i] ?? '').replace(/"/g,'""')}"`).join(','));
  });

  const blob = new Blob([out.join('\n')], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'feature-audit-view.csv';
  a.click();
}

function clearAllFilters(){ location.reload(); }

/* ===== UI: dropdown open/close ===== */
document.addEventListener('click', e=>{
  const b = e.target.closest('.dropdown-btn');
  if(b){
    b.parentElement.classList.toggle('open');
    return;
  }
  document.querySelectorAll('.dropdown-filter').forEach(d=>d.classList.remove('open'));
});

/* ===== Helpers ===== */
function escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function escapeHtmlText(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeHtmlAttr(s){ return escapeHtmlText(s); }

loadData();
</script>

</body>
</html>
