<meta name="robots" content="noindex, nofollow">
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Infotainment Feature Audit</title>

  <!-- DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />

  <!-- noUiSlider CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nouislider@15.7.1/dist/nouislider.min.css" />

  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 20px;
    }

    .dropdown-filter {
      position: relative;
      width: 250px;
    }

    .dropdown-btn {
      background: #f1f1f1;
      padding: 10px;
      border: 1px solid #ccc;
      cursor: pointer;
      user-select: none;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: white;
      border: 1px solid #ccc;
      z-index: 1000;
      max-height: 320px;
      overflow-y: auto;
      padding: 10px;
    }

    .dropdown-content input[type="text"] {
      width: 100%;
      padding: 5px;
      margin-bottom: 8px;
      box-sizing: border-box;
    }

    .dropdown-content label {
      display: block;
      margin-bottom: 4px;
      cursor: pointer;
    }

    .dropdown-filter.open .dropdown-content {
      display: block;
    }

    .slider-label {
      margin-top: 8px;
      font-size: 0.9em;
    }

    table {
      width: 100%;
    }

    button {
      margin-left: auto;
    }

    .slider-inputs {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .slider-inputs input {
      width: 50%;
      padding: 4px;
    }
  </style>
</head>
<body>

  <h2>UDS Infotainment Feature Audit (Sliders and Multiselect Filters)</h2>

  <div class="filters">
    <!-- Region filter -->
    <div id="regionFilter" class="dropdown-filter">
      <div class="dropdown-btn">Filter by Region</div>
      <div class="dropdown-content">
        <input type="text" placeholder="Search Region..." onkeyup="filterCheckboxList(this)">
        <label><input type="checkbox" class="select-all" checked> Select All</label>
        <div class="checkbox-list"></div>
      </div>
    </div>

    <!-- Make filter -->
    <div id="makeFilter" class="dropdown-filter">
      <div class="dropdown-btn">Filter by Make</div>
      <div class="dropdown-content">
        <input type="text" placeholder="Search Make..." onkeyup="filterCheckboxList(this)">
        <label><input type="checkbox" class="select-all" checked> Select All</label>
        <div class="checkbox-list"></div>
      </div>
    </div>

    <!-- Sliders for numeric specs -->
    <div id="slider-I" class="dropdown-filter">
      <div class="dropdown-btn">Filter Column I</div>
      <div class="dropdown-content">
        <div id="slider-range-8"></div>
        <div class="slider-inputs">
          <input type="number" id="min-8">
          <input type="number" id="max-8">
        </div>
      </div>
    </div>

    <div id="slider-K" class="dropdown-filter">
      <div class="dropdown-btn">Filter Column K</div>
      <div class="dropdown-content">
        <div id="slider-range-10"></div>
        <div class="slider-inputs">
          <input type="number" id="min-10">
          <input type="number" id="max-10">
        </div>
      </div>
    </div>

    <div id="slider-M" class="dropdown-filter">
      <div class="dropdown-btn">Filter Column M</div>
      <div class="dropdown-content">
        <div id="slider-range-12"></div>
        <div class="slider-inputs">
          <input type="number" id="min-12">
          <input type="number" id="max-12">
        </div>
      </div>
    </div>

    <div id="slider-O" class="dropdown-filter">
      <div class="dropdown-btn">Filter Column O</div>
      <div class="dropdown-content">
        <div id="slider-range-14"></div>
        <div class="slider-inputs">
          <input type="number" id="min-14">
          <input type="number" id="max-14">
        </div>
      </div>
    </div>

    <button onclick="clearAllFilters()">Clear All</button>
  </div>

  <table id="productTable" class="display" style="width:100%"></table>

  <!-- Libraries -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nouislider@15.7.1/dist/nouislider.min.js"></script>
