<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Dashboard</title>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <style>
    body { font-family: sans-serif; padding: 20px; }
    table { width: 100%; }
  </style>
</head>
<body>
  <h2>Interactive Product Dashboard</h2>
  <table id="productTable" class="display"></table>

  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script>
    async function loadData() {
      const response = await fetch('https://docs.google.com/spreadsheets/d/1TDrQezM_QvG3mABmTPXRLIizvjfGpIu-mKT7QUXM6qU/edit?usp=sharing');
      const csvText = await response.text();
      const rows = csvText
        .trim()
        .split('\n')
        .map(row => row.split(','))
        .filter(row => row.length > 1); // skips blank/short rows

      const [headers, ...data] = rows;

      $('#productTable').DataTable({
        data: data,
        columns: headers.map(h => ({ title: h })),
        paging: true,
        searching: true
      });
    }

    loadData();
  </script>
</body>
</html>
