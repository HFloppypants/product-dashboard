<meta name="robots" content="noindex, nofollow">
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Feature Audit Dashboard</title>
  <meta name="robots" content="noindex, nofollow" />

  <!-- DataTables & Slider CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nouislider@15.7.1/dist/nouislider.min.css" />

  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 20px;
    }

    .dropdown-filter {
      position: relative;
      width: 200px;
    }

    .dropdown-btn {
      background: #f1f1f1;
      padding: 8px;
      border: 1px solid #ccc;
      cursor: pointer;
      user-select: none;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: white;
      border: 1px solid #ccc;
      z-index: 1000;
      max-height: 250px;
      overflow-y: auto;
      padding: 10px;
    }

    .dropdown-filter.open .dropdown-content {
      display: block;
    }

    .checkbox-list label {
      display: block;
      margin-bottom: 4px;
    }

    .slider-filter {
      width: 250px;
    }

    .slider-label {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .noUi-target {
      margin-top: 10px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h2>Feature Audit Dashboard (Sliders + Checkbox Filters)</h2>

  <div class="filters">
    <!-- Checkbox Filters -->
    <div id="regionFilter" class="dropdown-filter">
      <div class="dropdown-btn">Filter by Region</div>
      <div class="dropdown-content">
        <input type="text" placeholder="Search..." onkeyup="filterCheckboxList(this)" />
        <label><input type="checkbox" class="select-all" checked /> Select All</label>
        <div class="checkbox-list"></div>
      </div>
    </div>

    <div id="makeFilter" class="dropdown-filter">
      <div class="dropdown-btn">Filter by Make</div>
      <div class="dropdown-content">
        <input type="text" placeholder="Search..." onkeyup="filterCheckboxList(this)" />
        <label><input type="checkbox" class="select-all" checked /> Select All</label>
        <div class="checkbox-list"></div>
      </div>
    </div>

    <!-- Sliders -->
    <div class="slider-filter">
      <div class="slider-label">Centre Screen Size (in)</div>
      <div id="slider-screen"></div>
    </div>

    <div class="slider-filter">
      <div class="slider-label">Cluster Size (in)</div>
      <div id="slider-cluster"></div>
    </div>

    <div class="slider-filter">
      <div class="slider-label"># Speakers</div>
      <div id="slider-speakers"></div>
    </div>

    <div class="slider-filter">
      <div class="slider-label"># USB (C)</div>
      <div id="slider-usbc"></div>
    </div>

    <button onclick="clearAllFilters()">Clear All</button>
  </div>

  <table id="productTable" class="display" style="width:100%"></table>

  <!-- JS Libraries -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nouislider@15.7.1/distribute/nouislider.min.js"></script>

  <script>
    let table;
    let minMax = {
      screen: [0, 100],
      cluster: [0, 100],
      speakers: [0, 50],
      usbc: [0, 10]
    };

    async function loadData() {
      const response = await fetch(
        'https://docs.google.com/spreadsheets/d/e/2PACX-1vRmRu1_HWep8KGgPJPAITrGn9ljdlTtFjrx85qAAzeiSZfC9ecKX8T0aSE9rt6vYLdZZ1ZTW-VpJyHg/pub?output=csv'
      );
      const csvText = await response.text();

      const rows = csvText
        .trim()
        .split('\n')
        .map(row => row.split(','))
        .filter(row => row.length > 1);

      const [headers, ...data] = rows;

      const thead = '<thead><tr>' + headers.map(h => `<th>${h}</th>`).join('') + '</tr></thead>';
      const tbody =
        '<tbody>' +
        data.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`).join('') +
        '</tbody>';

      document.getElementById('productTable').innerHTML = thead + tbody;

      table = $('#productTable').DataTable({
        paging: true,
        searching: true,
        scrollX: true,
        destroy: true,
        pageLength: 25
      });

      createDropdownCheckboxes(0, 'regionFilter'); // Region
      createDropdownCheckboxes(1, 'makeFilter'); // Make

      initSliders();
    }

    function createDropdownCheckboxes(colIndex, containerId) {
      const column = table.column(colIndex);
      const container = document.querySelector(`#${containerId} .checkbox-list`);
      const values = column.data().unique().sort().toArray();

      container.innerHTML = '';

      values.forEach(val => {
        const label = document.createElement('label');
        label.innerHTML = `<input type="checkbox" class="filter-option" value="${val}" checked> ${val}`;
        container.appendChild(label);
      });

      document.querySelectorAll(`#${containerId} input`).forEach(input => {
        input.addEventListener('change', () => applyFilters());
      });

      const selectAll = document.querySelector(`#${containerId} .select-all`);
      selectAll.addEventListener('change', function () {
        const allOptions = container.querySelectorAll('input[type=checkbox]');
        allOptions.forEach(opt => (opt.checked = this.checked));
        applyFilters();
      });
    }

    function applyFilters() {
      ['regionFilter', 'makeFilter'].forEach((id, index) => {
        const checkedVals = Array.from(document.querySelectorAll(`#${id} .filter-option:checked`)).map(cb =>
          $.fn.dataTable.util.escapeRegex(cb.value)
        );
        table.column(index).search(checkedVals.length ? checkedVals.join('|') : '', true, false);
      });

      // Sliders — filter numeric values
      const screen = screenSlider.noUiSlider.get().map(parseFloat);
      const cluster = clusterSlider.noUiSlider.get().map(parseFloat);
      const speakers = speakersSlider.noUiSlider.get().map(parseFloat);
      const usbc = usbcSlider.noUiSlider.get().map(parseFloat);

      table.draw();
      $.fn.dataTable.ext.search = [
        function (settings, data, dataIndex) {
          const s = parseFloat(data[10]) || 0;
          const c = parseFloat(data[14]) || 0;
          const sp = parseFloat(data[16]) || 0;
          const uc = parseFloat(data[21]) || 0;

          return (
            s >= screen[0] &&
            s <= screen[1] &&
            c >= cluster[0] &&
            c <= cluster[1] &&
            sp >= speakers[0] &&
            sp <= speakers[1] &&
            uc >= usbc[0] &&
            uc <= usbc[1]
          );
        }
      ];
      table.draw();
    }

    function clearAllFilters() {
      document.querySelectorAll('.filter-option').forEach(cb => (cb.checked = true));
      document.querySelectorAll('.select-all').forEach(cb => (cb.checked = true));
      screenSlider.noUiSlider.set(minMax.screen);
      clusterSlider.noUiSlider.set(minMax.cluster);
      speakersSlider.noUiSlider.set(minMax.speakers);
      usbcSlider.noUiSlider.set(minMax.usbc);
      applyFilters();
    }

    function filterCheckboxList(input) {
      const filter = input.value.toLowerCase();
      const list = input.closest('.dropdown-content').querySelectorAll('.checkbox-list label');

      list.forEach(label => {
        const text = label.textContent.toLowerCase();
        label.style.display = text.includes(filter) ? '' : 'none';
      });
    }

    // Dropdown toggle
    document.addEventListener('click', function (e) {
      document.querySelectorAll('.dropdown-filter').forEach(drop => {
        if (drop.contains(e.target)) {
          drop.classList.toggle('open');
        } else {
          drop.classList.remove('open');
        }
      });
    });

    // Sliders
    let screenSlider, clusterSlider, speakersSlider, usbcSlider;

    function initSlider(id, range, step = 1) {
      const slider = document.getElementById(id);
      noUiSlider.create(slider, {
        start: range,
        connect: true,
        step: step,
        range: {
          min: range[0],
          max: range[1]
        }
      });
      slider.noUiSlider.on('update', applyFilters);
      return slider;
    }

    function initSliders() {
      screenSlider = initSlider('slider-screen', minMax.screen);
      clusterSlider = initSlider('slider-cluster', minMax.cluster);
      speakersSlider = initSlider('slider-speakers', minMax.speakers, 1);
      usbcSlider = initSlider('slider-usbc', minMax.usbc, 1);
    }

    loadData();
  </script>
</body>
</html>
