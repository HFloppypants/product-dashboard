<meta name="robots" content="noindex, nofollow">
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Feature Audit Dashboard</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <!-- noUiSlider CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nouislider@15.7.1/dist/nouislider.min.css">

  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 20px;
      align-items: flex-start;
    }

    .filter-box {
      border: 1px solid #ccc;
      padding: 10px;
      background: #f9f9f9;
    }

    .checkbox-list label {
      display: block;
      margin-bottom: 4px;
    }

    .slider-block {
      width: 300px;
    }

    .slider-label {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .slider-values {
      display: flex;
      justify-content: space-between;
      font-size: 0.9em;
      margin-top: 5px;
    }

    #productTable {
      width: 100%;
    }

    button {
      height: 40px;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <h2>Feature Audit Dashboard (Sliders + Checkbox Filters)</h2>

  <div class="filters">
    <!-- Region Filter -->
    <div id="regionFilter" class="filter-box">
      <strong>Filter by Region</strong>
      <label><input type="checkbox" class="select-all" checked> Select All</label>
      <div class="checkbox-list"></div>
    </div>

    <!-- Make Filter -->
    <div id="makeFilter" class="filter-box">
      <strong>Filter by Make</strong>
      <label><input type="checkbox" class="select-all" checked> Select All</label>
      <div class="checkbox-list"></div>
    </div>

    <!-- Sliders -->
    <div class="filter-box slider-block">
      <div class="slider-label">Centre Screen Size (in)</div>
      <div id="slider-8"></div>
      <div class="slider-values" id="slider-values-8"></div>
    </div>

    <div class="filter-box slider-block">
      <div class="slider-label">Cluster Size (in)</div>
      <div id="slider-10"></div>
      <div class="slider-values" id="slider-values-10"></div>
    </div>

    <div class="filter-box slider-block">
      <div class="slider-label"># Speakers</div>
      <div id="slider-12"></div>
      <div class="slider-values" id="slider-values-12"></div>
    </div>

    <div class="filter-box slider-block">
      <div class="slider-label"># USB (C)</div>
      <div id="slider-14"></div>
      <div class="slider-values" id="slider-values-14"></div>
    </div>

    <button onclick="clearAllFilters()">Clear All</button>
  </div>

  <table id="productTable" class="display"></table>

  <!-- JS Includes -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nouislider@15.7.1/distribute/nouislider.min.js"></script>

  <script>
    let table;
    let sliderFilters = {};

    document.addEventListener("DOMContentLoaded", async () => {
      const response = await fetch('https://docs.google.com/spreadsheets/d/e/2PACX-1vRmRu1_HWep8KGgPJPAITrGn9ljdlTtFjrx85qAAzeiSZfC9ecKX8T0aSE9rt6vYLdZZ1ZTW-VpJyHg/pub?output=csv');
      const csv = await response.text();

      const rows = csv.trim().split('\n').map(r => r.split(','));
      const [headers, ...data] = rows;

      const tableHTML = `
        <thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>
        <tbody>${data.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>
      `;
      document.getElementById('productTable').innerHTML = tableHTML;

      table = $('#productTable').DataTable({
        scrollX: true,
        pageLength: 25
      });

      // Checkbox Filters
      createCheckboxFilter(0, 'regionFilter');
      createCheckboxFilter(1, 'makeFilter');

      // Sliders
      createSlider(8, "slider-8", "slider-values-8");   // Centre Screen
      createSlider(10, "slider-10", "slider-values-10"); // Cluster Size
      createSlider(12, "slider-12", "slider-values-12"); // # Speakers
      createSlider(14, "slider-14", "slider-values-14"); // # USB (C)
    });

    function createCheckboxFilter(colIndex, containerId) {
      const values = table.column(colIndex).data().unique().sort().toArray();
      const container = document.querySelector(`#${containerId} .checkbox-list`);
      container.innerHTML = '';

      values.forEach(val => {
        container.innerHTML += `<label><input type="checkbox" class="filter-option" value="${val}" checked> ${val}</label>`;
      });

      // Bind filter events
      container.querySelectorAll('input').forEach(cb => cb.addEventListener('change', applyFilters));

      document.querySelector(`#${containerId} .select-all`).addEventListener('change', e => {
        container.querySelectorAll('input').forEach(cb => cb.checked = e.target.checked);
        applyFilters();
      });
    }

    function createSlider(colIndex, sliderId, displayId) {
      const values = table.column(colIndex).data().map(v => parseFloat(v)).filter(v => !isNaN(v));
      if (!values.length) return;

      const min = Math.min(...values);
      const max = Math.max(...values);
      sliderFilters[colIndex] = [min, max];

      const slider = document.getElementById(sliderId);
      const display = document.getElementById(displayId);

      noUiSlider.create(slider, {
        start: [min, max],
        connect: true,
        range: { min, max },
        step: 1
      });

      slider.noUiSlider.on('update', (range) => {
        sliderFilters[colIndex] = range.map(parseFloat);
        display.innerHTML = `<span>${range[0]}</span><span>${range[1]}</span>`;
        table.draw();
      });
    }

    // Custom filter for sliders
    $.fn.dataTable.ext.search.push((settings, data) => {
      for (const [colIndex, [min, max]] of Object.entries(sliderFilters)) {
        const val = parseFloat(data[colIndex]);
        if (isNaN(val) || val < min || val > max) return false;
      }
      return true;
    });

    function applyFilters() {
      ['regionFilter', 'makeFilter'].forEach((id, index) => {
        const checked = [...document.querySelectorAll(`#${id} .filter-option:checked`)]
          .map(cb => $.fn.dataTable.util.escapeRegex(cb.value));
        table.column(index).search(checked.length ? checked.join('|') : '', true, false);
      });
      table.draw();
    }

    function clearAllFilters() {
      // Reset checkboxes
      document.querySelectorAll('.filter-option, .select-all').forEach(cb => cb.checked = true);
      // Reset sliders
      for (const [colIndex, [min, max]] of Object.entries(sliderFilters)) {
        const slider = document.getElementById(`slider-${colIndex}`);
        if (slider && slider.noUiSlider) {
          slider.noUiSlider.set([min, max]);
        }
      }
      applyFilters();
    }
  </script>

</body>
</html>
